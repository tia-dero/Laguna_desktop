const configurableDockApps = dockApps.slice(1, -1);
const dockDragType = 'application/x-laguna-dock';
let dockPrefs = readDockPrefs();
let dockDrag = null;
let dockRevealed = false;

function readDockPrefs() {
  try {
    const saved = JSON.parse(readValue('dock.v1', '{}'));
    const order = Array.isArray(saved.order) ? saved.order.filter((id) => configurableDockApps.includes(id)) : [];
    const unpinned = Array.isArray(saved.unpinned) ? saved.unpinned.filter((id) => configurableDockApps.includes(id)) : [];
    return { order: [...new Set([...order, ...configurableDockApps])], unpinned: [...new Set(unpinned)], autoHide: saved.autoHide === true };
  } catch {
    return { order: [...configurableDockApps], unpinned: [], autoHide: false };
  }
}

function updateDockPrefs(next, focusApp = null, focusSetting = null) {
  dockPrefs = next;
  dockRevealed = false;
  const stored = writeValue('dock.v1', JSON.stringify(next));
  refreshDock();
  const settings = windows.get('settings');
  if (settings) {
    renderSettings(settings);
    if (focusSetting && !settings.element.hidden) settings.content.querySelector(focusSetting)?.focus({ preventScroll: true });
  }
  if (focusApp) (byId('dock').querySelector('[data-app="' + focusApp + '"]') ?? byId('dock').querySelector('[data-app="finder"]')).focus();
  byId('announcement').textContent = stored ? 'Preferenze Dock salvate.' : 'Preferenze Dock applicate a questa sessione.';
}

function pinDockApp(id, focusSetting = false) {
  if (!configurableDockApps.includes(id)) return;
  const unpinned = dockPrefs.unpinned.includes(id)
    ? dockPrefs.unpinned.filter((item) => item !== id)
    : [...dockPrefs.unpinned, id];
  updateDockPrefs({ ...dockPrefs, unpinned }, focusSetting ? null : id, focusSetting ? '[data-dock-pin="' + id + '"]' : null);
}

function moveDockApp(id, target, after = false, focusSetting = false) {
  const order = dockPrefs.order.filter((item) => item !== id);
  if (id === target || !configurableDockApps.includes(id) || !order.includes(target)) return;
  order.splice(order.indexOf(target) + Number(after), 0, id);
  updateDockPrefs({ ...dockPrefs, order }, focusSetting ? null : id, focusSetting ? '[data-dock-pin="' + id + '"]' : null);
}

function setDockVisibility() {
  const area = byId('dock-area');
  area.dataset.autohide = String(dockPrefs.autoHide);
  area.dataset.revealed = String(dockRevealed);
  const reveal = byId('dock-reveal');
  reveal.hidden = !dockPrefs.autoHide;
  reveal.setAttribute('aria-expanded', dockRevealed);
}

function appName(id) {
  return apps[id]?.name ?? { launchpad: 'Launchpad', mission: 'Mission Control', trash: 'Cestino' }[id];
}

function launch(id) {
  if (id === 'launchpad') {
    openLaunchpad();
  } else if (id === 'mission') {
    openMission();
  } else if (id === 'trash') {
    showFolder('trash');
  } else {
    openWindow(id);
  }
}

function fit(rect) {
  const { margin, minWidth, minHeight } = bounds;
  const availableWidth = Math.max(1, desktop.clientWidth - margin * 2);
  const availableHeight = Math.max(1, desktop.clientHeight - margin * 2);
  const width = Math.min(Math.max(rect.width, minWidth), availableWidth);
  const height = Math.min(Math.max(rect.height, minHeight), availableHeight);
  return {
    width,
    height,
    left: Math.max(margin, Math.min(rect.left, desktop.clientWidth - width - margin)),
    top: Math.max(margin, Math.min(rect.top, desktop.clientHeight - height - margin))
  };
}

function position(record) {
  const margin = bounds.margin;
  const rect = record.maximized
    ? { left: margin, top: margin, width: desktop.clientWidth - margin * 2, height: desktop.clientHeight - margin * 2 }
    : record.rect;
  const fitted = fit(rect);
  for (const [key, value] of Object.entries(fitted)) record.element.style[key] = value + 'px';
}

function refreshDock() {
  const dock = byId('dock');
  const pinned = dockPrefs.order.filter((id) => !dockPrefs.unpinned.includes(id));
  const running = dockPrefs.order.filter((id) => dockPrefs.unpinned.includes(id) && windows.has(id));
  const visible = ['finder', ...pinned, ...running, 'trash'];
  const existing = [...dock.querySelectorAll('[data-app]')].map((entry) => entry.dataset.app);
  if (visible.join() !== existing.join()) renderDock(visible);
  setDockVisibility();
  for (const entry of byId('dock').querySelectorAll('[data-app]')) {
    entry.classList.toggle('is-open', windows.has(entry.dataset.app));
    if (entry.dataset.app === 'trash') entry.classList.toggle('has-items', folderItems('trash').length > 0);
  }
}

function activate(record) {
  activeWindow = record;
  if (record) {
    if (++zIndex > 20) {
      const ordered = [...windows.values()].sort((first, second) => first.order - second.order);
      ordered.forEach((item, index) => {
        item.order = index + 1;
        item.element.style.zIndex = item.order;
      });
      zIndex = ordered.length + 1;
    }
    record.order = zIndex;
    record.element.style.zIndex = record.order;
  }
  for (const item of windows.values()) item.element.classList.toggle('is-active', item === record);
  byId('app-menu').textContent = record ? appName(record.id) : 'Finder';
  saveWorkspace();
}

function focusNext(fallbackId) {
  const remaining = [...windows.values()].filter((record) => !record.element.hidden);
  const next = remaining.sort((first, second) => second.order - first.order)[0];
  activate(next ?? null);
  if (next) {
    next.element.focus({ preventScroll: true });
  } else {
    const dockButton = byId('dock').querySelector('[data-app="' + fallbackId + '"]');
    (dockButton ?? byId('app-menu')).focus();
  }
}

function syncSpaces() {
  for (const record of windows.values()) {
    record.element.hidden = Boolean(record.minimized || record.space !== activeSpace);
  }
  desktop.setAttribute('aria-label', 'Scrivania ' + (spaces.indexOf(activeSpace) + 1));
  desktop.dataset.space = String(spaces.indexOf(activeSpace) + 1);
}

function switchSpace(id) {
  if (!spaces.includes(id) || activeSpace === id) return;
  activeSpace = id;
  syncSpaces();
  syncWallpaper();
  renderWidgets();
  const next = [...windows.values()].filter((record) => !record.element.hidden)
    .sort((first, second) => second.order - first.order)[0];
  activate(next ?? null);
}

function closeWindow(record) {
  if (record.id === 'preview') {
    clearPreview();
    fileSelection += 1;
  }
  record.element.remove();
  windows.delete(record.id);
  refreshDock();
  focusNext(record.id);
}

function minimize(record) {
  record.minimized = true;
  record.element.hidden = true;
  focusNext(record.id);
}

function toggleMaximize(record) {
  record.maximized = !record.maximized;
  record.element.classList.toggle('is-maximized', record.maximized);
  const label = record.maximized ? 'Ripristina dimensioni' : 'Ingrandisci finestra';
  record.maxButton.setAttribute('aria-label', label);
  record.maxButton.title = label;
  position(record);
  saveWorkspace();
}

function beginGeometry(event, record, handle, edge) {
  if (event.button !== 0 || record.maximized || (!edge && event.target.closest('button'))) return;
  const origin = fit(record.rect);
  const startX = event.clientX;
  const startY = event.clientY;
  const pointer = event.pointerId;
  handle.setPointerCapture(pointer);
  function move(update) {
    if (update.pointerId !== pointer) return;
    const offsetX = update.clientX - startX;
    const offsetY = update.clientY - startY;
    const next = { ...origin };
    if (!edge) {
      next.left += offsetX;
      next.top += offsetY;
    } else {
      if (edge !== 'bottom') {
        next.width = Math.min(origin.width + offsetX, desktop.clientWidth - origin.left - bounds.margin);
      }
      if (edge !== 'right') {
        next.height = Math.min(origin.height + offsetY, desktop.clientHeight - origin.top - bounds.margin);
      }
    }
    record.rect = fit(next);
    position(record);
  }
  handle.addEventListener('pointermove', move);
  handle.addEventListener('lostpointercapture', () => {
    handle.removeEventListener('pointermove', move);
    saveWorkspace();
  }, { once: true });
}

function openWindow(id, focus = true) {
  let record = windows.get(id);
  if (record) {
    record.minimized = false;
    if (id === 'settings' && record.space !== activeSpace) {
      record.space = activeSpace;
      renderSettings(record);
    }
    switchSpace(record.space);
  } else {
    const { name, size, render } = apps[id];
    const element = document.createElement('section');
    element.className = 'window';
    element.dataset.window = id;
    element.tabIndex = -1;
    element.setAttribute('aria-labelledby', 'title-' + id);
    element.innerHTML = '<header class="titlebar"><div class="traffic"></div><h1 class="title-label" id="title-' + id + '"></h1></header><div class="window-content"></div>';
    const titlebar = element.querySelector('.titlebar');
    const title = element.querySelector('.title-label');
    title.textContent = name;
    const offset = Math.min(windows.size, 5) * 21;
    const [width, height] = size;
    record = {
      id, element, titlebar, title, space: activeSpace,
      content: element.querySelector('.window-content'),
      rect: {
        width, height,
        left: Math.round((desktop.clientWidth - width) / 2) + offset,
        top: Math.round((desktop.clientHeight - height) * .44) + offset
      }
    };
    const controls = [
      ['Chiudi finestra', '#ff655d', '×', () => closeWindow(record)],
      ['Riduci a icona', '#f6bf46', '−', () => minimize(record)],
      ['Ingrandisci finestra', '#36c766', '+', () => toggleMaximize(record)]
    ];
    for (const [label, color, symbol, action] of controls) {
      const control = button(label, '', '<span aria-hidden="true">' + symbol + '</span>', action);
      control.title = label;
      control.style.setProperty('--light', color);
      titlebar.querySelector('.traffic').append(control);
      record.maxButton = control;
    }
    element.addEventListener('pointerdown', () => {
      if (activeWindow !== record) activate(record);
    });
    element.addEventListener('focusin', () => {
      if (activeWindow !== record) activate(record);
    });
    titlebar.addEventListener('pointerdown', (event) => beginGeometry(event, record, titlebar));
    titlebar.addEventListener('dblclick', (event) => {
      if (!event.target.closest('button')) toggleMaximize(record);
    });
    for (const edge of ['right', 'bottom', 'corner']) {
      const handle = document.createElement('div');
      handle.className = 'resize-handle';
      handle.dataset.edge = edge;
      handle.setAttribute('aria-hidden', 'true');
      handle.addEventListener('pointerdown', (event) => beginGeometry(event, record, handle, edge));
      element.append(handle);
    }
    windows.set(id, record);
    byId('windows').append(element);
    position(record);
    render(record);
  }
  syncSpaces();
  activate(record);
  refreshDock();
  if (focus) record.element.focus({ preventScroll: true });
  return record;
}

const folders = {
  desktop: { name: 'Scrivania', icon: 'desktop' },
  documents: { name: 'Documenti', icon: 'document' },
  downloads: { name: 'Download', icon: 'download' },
  images: { name: 'Immagini', icon: 'image' },
  trash: { name: 'Cestino', icon: 'trash', empty: 'Il Cestino è vuoto.' },
  local: { name: 'File locali', icon: 'drive' }
};
const files = {
  welcome: { name: 'Benvenuto.txt', parent: 'documents', text: 'Benvenuto in Laguna!\n\nApri una cartella o un documento con un doppio clic. Con la tastiera usa Tab e Invio.\n\nProva Spotlight con Ctrl + Spazio e cerca «Progetti» o «Note».' },
  shortcuts: { name: 'Scorciatoie.txt', parent: 'documents', text: 'Ctrl + Spazio   Apri o chiudi Spotlight\nEsc             Chiudi menu o pannello\nTab             Spostati tra i controlli\nInvio           Apri l’elemento evidenziato\nF11             Schermo intero nel browser' },
  todo: { name: 'Appunti.txt', parent: 'documents', text: 'Da provare oggi\n\n• Trascinare una finestra dalla barra del titolo\n• Cambiare sfondo in Impostazioni\n• Aprire l’app Note per scrivere qualcosa' },
  project: { name: 'Progetto Laguna.txt', parent: 'projects', text: 'Progetto Laguna\n\nUn desktop simulato, costruito con HTML, CSS e JavaScript.' },
  memo: { name: 'Promemoria.txt', parent: 'personal', text: 'Per scrivere e conservare i tuoi appunti usa l’app Note nel Dock.' },
  sample: { name: 'Esempio.txt', parent: 'downloads', text: 'Questo file dimostrativo è incluso nel simulatore.' }
};
const finder = {
  tabs: [{ history: ['documents'], index: 0 }],
  activeTab: 0,
  view: 'grid',
  sort: 'default',
  selection: new Set(),
  anchor: null,
  get tab() { return this.tabs[this.activeTab]; },
  get selected() { return this.selection.size === 1 ? this.selection.values().next().value : null; }
};
const tabLimit = 12;
const finderDragType = 'application/x-laguna-items';
let finderDrag = [];
const fixedFolders = ['desktop', 'documents', 'downloads', 'images', 'trash', 'local'];
const limitBytes = 256 * 1024;
const limitEntries = 240;
const limitStorage = 2 * 1024 * 1024;
const rasterType = /^image\/(png|jpeg|gif|webp|bmp|avif)$/;
const textExtension = /\.(txt|md|log|csv|json)$/i;
let finderNotice = '';
let finderMessage = '';
let importDestination = null;
let nextEntry = 0;
let virtualEntries = loadVirtualEntries();

function loadVirtualEntries() {
  const saved = readValue('finder.v1', '');
  if (saved) {
    try {
      const entries = JSON.parse(saved);
      if (Array.isArray(entries) && entries.every(([id, entry]) =>
        typeof id === 'string' && !fixedFolders.includes(id) && entry && typeof entry.name === 'string'
        && typeof entry.parent === 'string' && ['folder', 'text', 'import'].includes(entry.kind)
        && (entry.kind !== 'text' || typeof entry.text === 'string')
        && (entry.kind !== 'import' || typeof entry.type === 'string' && typeof entry.base64 === 'string'))) {
        return new Map(entries);
      }
    } catch {}
  }
  return new Map([
    ['projects', { name: 'Progetti', parent: 'documents', kind: 'folder' }],
    ['personal', { name: 'Personale', parent: 'documents', kind: 'folder' }],
    ...Object.entries(files).map(([id, entry]) => [id, { ...entry, kind: 'text' }])
  ]);
}

function folderInfo(id) {
  return fixedFolders.includes(id) ? folders[id] : virtualEntries.get(id);
}

function folderParent(id) {
  if (['documents', 'downloads', 'images'].includes(id)) return 'desktop';
  return virtualEntries.get(id)?.parent;
}

function insideFolder(id, ancestor) {
  const seen = new Set();
  while (id && !seen.has(id)) {
    if (id === ancestor) return true;
    seen.add(id);
    id = folderParent(id);
  }
  return false;
}

function isVisibleEntry(id) {
  const seen = new Set();
  while (id && !seen.has(id)) {
    if (fixedFolders.includes(id)) return true;
    seen.add(id);
    const entry = virtualEntries.get(id);
    if (!entry || entry.trashed) return false;
    id = entry.parent;
  }
  return false;
}

function canWriteFolder(id) {
  return id !== 'local' && id !== 'trash' && isVisibleEntry(id)
    && (fixedFolders.includes(id) || virtualEntries.get(id)?.kind === 'folder');
}

function folderItems(id) {
  if (id === 'local') return [];
  const entries = [...virtualEntries].filter(([, entry]) => id === 'trash' ? entry.trashed : entry.parent === id && !entry.trashed);
  return [
    ...(id === 'desktop' ? ['documents', 'downloads', 'images'] : []),
    ...entries.map(([itemId]) => itemId)
  ];
}

const finderCollator = new Intl.Collator('it', { numeric: true, sensitivity: 'base' });

function displayItems() {
  const items = folderItems(currentFolder());
  if (finder.sort === 'default') return items;
  return items.sort((first, second) => {
    const firstItem = folderInfo(first);
    const secondItem = folderInfo(second);
    if (finder.sort === 'kind') {
      const typeDifference = Number((firstItem.kind ?? 'folder') !== 'folder') - Number((secondItem.kind ?? 'folder') !== 'folder');
      if (typeDifference) return typeDifference;
    }
    return finderCollator.compare(firstItem.name, secondItem.name);
  });
}

function sortFinder(sort) {
  openWindow('finder');
  finder.sort = sort;
  updateFinder(windows.get('finder'));
  saveWorkspace();
}

function persistEntries(entries) {
  const serialized = JSON.stringify([...entries]);
  if (entries.size > limitEntries || serialized.length > limitStorage) return 'Il disco virtuale è pieno. Esporta o elimina alcuni elementi.';
  virtualEntries = entries;
  finderNotice = writeValue('finder.v1', serialized) ? '' : 'Modifiche disponibili fino alla chiusura della pagina';
  const record = windows.get('finder');
  if (record) {
    if (!isVisibleEntry(currentFolder())) goToFolder('documents');
    else updateFinder(record);
  }
  refreshDock();
  return '';
}

function updateEntry(id, changes) {
  const entry = virtualEntries.get(id);
  if (!entry) return 'L’elemento non è più disponibile.';
  const entries = new Map(virtualEntries);
  entries.set(id, { ...entry, ...changes });
  return persistEntries(entries);
}

function nameError(name, parent, except) {
  if (!name || name.length > 120 || /[\/\\\u0000-\u001f]/.test(name) || ['.', '..'].includes(name)) {
    return 'Usa un nome da 1 a 120 caratteri, senza barre.';
  }
  const taken = folderItems(parent).some((id) =>
    id !== except && normalize((virtualEntries.get(id) ?? folders[id]).name) === normalize(name));
  return taken ? 'In questa cartella esiste già un elemento con questo nome.' : '';
}

function addEntry(entry) {
  if (!canWriteFolder(entry.parent)) return 'Questa posizione non è più disponibile.';
  const error = nameError(entry.name, entry.parent);
  if (error) return error;
  const entries = new Map(virtualEntries);
  let id;
  do {
    id = 'elemento-' + Date.now().toString(36) + '-' + (++nextEntry).toString(36);
  } while (entries.has(id));
  entries.set(id, entry);
  return persistEntries(entries);
}

function moveEntry(id, destination) {
  return moveEntries([id], destination);
}

function moveEntries(ids, destination) {
  if (!canWriteFolder(destination) || !ids.length) return 'Scegli un’altra cartella.';
  const entries = new Map(virtualEntries);
  const names = new Set(folderItems(destination).filter((id) => !ids.includes(id)).map((id) => normalize(folderInfo(id).name)));
  for (const id of ids) {
    const entry = entries.get(id);
    if (!entry || insideFolder(destination, id)) return 'Scegli un’altra cartella.';
    const name = normalize(entry.name);
    if (names.has(name)) return 'In questa cartella esiste già un elemento con questo nome.';
    names.add(name);
    entries.set(id, { ...entry, parent: destination, trashed: false });
  }
  return persistEntries(entries);
}

function emptyTrash() {
  const trashed = [...virtualEntries].filter(([, entry]) => entry.trashed).map(([id]) => id);
  const entries = new Map([...virtualEntries].filter(([id]) => !trashed.some((root) => insideFolder(id, root))));
  return persistEntries(entries);
}

function currentFolder() {
  return finder.tab.history[finder.tab.index];
}

function resetFinderSelection() {
  finder.selection.clear();
  finder.anchor = null;
  finderMessage = '';
}

function goToFolder(id) {
  if (!fixedFolders.includes(id) && !canWriteFolder(id)) return;
  if (id !== currentFolder()) {
    finder.tab.history = [...finder.tab.history.slice(0, finder.tab.index + 1), id];
    finder.tab.index += 1;
    resetFinderSelection();
  }
  updateFinder(windows.get('finder'));
  saveWorkspace();
}

function showFolder(id) {
  openWindow('finder');
  goToFolder(id);
}

function changeHistory(direction) {
  const next = historyIndex(direction);
  if (next === finder.tab.index) return;
  finder.tab.index = next;
  resetFinderSelection();
  updateFinder(windows.get('finder'));
  saveWorkspace();
}

function historyIndex(direction) {
  const tab = finder.tab;
  for (let index = tab.index + direction; index >= 0 && index < tab.history.length; index += direction) {
    if (isVisibleEntry(tab.history[index])) return index;
  }
  return tab.index;
}

function switchFinderTab(index) {
  finder.activeTab = index;
  resetFinderSelection();
  if (!isVisibleEntry(currentFolder())) goToFolder('documents');
  else updateFinder(windows.get('finder'));
  saveWorkspace();
}

function newFinderTab(folder = currentFolder()) {
  if (finder.tabs.length >= tabLimit) return;
  finder.tabs.push({ history: [folder], index: 0 });
  switchFinderTab(finder.tabs.length - 1);
  windows.get('finder').content.querySelector('.finder-tab-active')?.focus();
}

function closeFinderTab(index) {
  if (finder.tabs.length < 2) return;
  finder.tabs.splice(index, 1);
  const next = finder.activeTab - (index < finder.activeTab ? 1 : 0);
  switchFinderTab(Math.min(next, finder.tabs.length - 1));
  windows.get('finder').content.querySelector('.finder-tab-active')?.focus();
}

function setFinderView(view) {
  if (!windows.has('finder')) openWindow('finder');
  finder.view = view;
  updateFinder(windows.get('finder'));
  saveWorkspace();
}

function openItem(id) {
  const item = virtualEntries.get(id);
  if (!isVisibleEntry(id)) return;
  if (fixedFolders.includes(id) || item?.kind === 'folder') {
    showFolder(id);
    return;
  }
  fileSelection += 1;
  showPreview(virtualPreview(id));
}

function virtualPreview(id) {
  const item = virtualEntries.get(id);
  const data = { id, name: item.name, description: 'Documento virtuale · Finder' };
  if (item.kind === 'text') {
    data.text = item.text;
  } else if (rasterType.test(item.type)) {
    data.url = URL.createObjectURL(entryBlob(item));
  } else if (item.type.startsWith('text/') || textExtension.test(item.name)) {
    data.text = new TextDecoder().decode(decodeBytes(item.base64));
  } else {
    data.description += ' · Usa Esporta per scaricare una copia';
  }
  return data;
}

function decodeBytes(base64) {
  return Uint8Array.from(atob(base64), (character) => character.charCodeAt(0));
}

function entryBlob(entry) {
  return entry.kind === 'text'
    ? new Blob([entry.text], { type: 'text/plain;charset=utf-8' })
    : new Blob([decodeBytes(entry.base64)], { type: entry.type });
}

function exportEntry(id) {
  const entry = virtualEntries.get(id);
  if (!entry || entry.kind === 'folder') return;
  const url = URL.createObjectURL(entryBlob(entry));
  const download = document.createElement('a');
  download.download = entry.name;
  download.href = url;
  document.body.append(download);
  download.click();
  download.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

async function importVirtualFile(event) {
  const file = event.target.files[0];
  const parent = importDestination;
  event.target.value = '';
  importDestination = null;
  if (!file) return;
  try {
    if (file.size > limitBytes) {
      showFinderMessage('Il limite per ogni file importato è 256 KiB.');
      return;
    }
    const bytes = new Uint8Array(await file.arrayBuffer());
    let binary = '';
    for (let offset = 0; offset < bytes.length; offset += 8192) {
      binary += String.fromCharCode(...bytes.subarray(offset, offset + 8192));
    }
    const error = addEntry({ name: file.name, parent, kind: 'import', type: file.type, base64: btoa(binary) });
    showFinderMessage(error || 'Copia importata in ' + folderInfo(parent).name + '.');
  } catch {
    showFinderMessage('Impossibile leggere il file scelto.');
  }
}

function renderFinder(record) {
  const historyBar = document.createElement('div');
  historyBar.className = 'finder-navigation';
  record.backButton = iconButton('Indietro', 'left', () => changeHistory(-1));
  record.forwardButton = iconButton('Avanti', 'right', () => changeHistory(1));
  historyBar.append(record.backButton, record.forwardButton);
  record.title.before(historyBar);
  const viewBar = document.createElement('div');
  viewBar.className = 'view-buttons';
  record.gridButton = iconButton('Vista a icone', 'grid', () => setFinderView('grid'));
  record.listButton = iconButton('Vista a elenco', 'list', () => setFinderView('list'));
  viewBar.append(record.gridButton, record.listButton);
  record.title.after(viewBar);
  record.actions = iconButton('Azioni Finder', 'more', (event) => {
    toggleMenu(record.actions, event.detail === 0, finderActions());
  });
  record.actions.dataset.finderMenu = '';
  record.actions.setAttribute('aria-controls', 'menu-popover');
  record.actions.setAttribute('aria-expanded', 'false');
  viewBar.after(record.actions);
  record.content.innerHTML = '<div class="finder-body"><nav class="finder-sidebar" aria-label="Cartelle Finder"></nav><div class="finder-main"><nav class="finder-tabs" aria-label="Schede Finder"></nav><nav class="finder-path" aria-label="Percorso corrente"></nav><div class="files"></div><footer class="finder-footer"><span></span><span></span></footer></div></div>';
  const sidebar = record.content.querySelector('.finder-sidebar');
  const grid = record.content.querySelector('.files');
  grid.addEventListener('click', (event) => {
    if (event.target === grid) selectFinderItem(null, grid);
  });
  grid.addEventListener('contextmenu', (event) => {
    event.preventDefault();
    const tile = event.target.closest('[data-item]');
    if (!finder.selection.has(tile?.dataset.item)) selectFinderItem(tile?.dataset.item ?? null, grid);
    toggleMenu(record.actions, false, finderActions(), { left: event.clientX, top: event.clientY });
  });
  grid.addEventListener('keydown', (event) => {
    const id = event.target.closest('[data-item]')?.dataset.item;
    if (!id || event.isComposing) return;
    const modifier = event.ctrlKey || event.metaKey;
    const arrows = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];
    if (event.code === 'Space' && !modifier && currentFolder() !== 'trash') {
      if (!finder.selection.has(id)) selectFinderItem(id, grid);
      openQuickLook();
    } else if (event.key.toLowerCase() === 'a' && modifier) {
      finder.selection = new Set(folderItems(currentFolder()));
      updateSelection(grid);
    } else if (arrows.includes(event.key)) {
      const columns = getComputedStyle(grid).gridTemplateColumns.trim().split(/\s+/).length;
      const offsets = [-1, 1, -columns, columns];
      const tiles = [...grid.querySelectorAll('[data-item]')];
      const position = tiles.findIndex((tile) => tile.dataset.item === id);
      const target = tiles[position + offsets[arrows.indexOf(event.key)]];
      if (target) {
        if (event.shiftKey && !finder.anchor) finder.anchor = id;
        selectFinderItem(target.dataset.item, grid, event);
        target.focus();
      }
    } else if (event.key === 'Escape') {
      selectFinderItem(null, grid);
    } else if (currentFolder() !== 'trash' && event.key === 'Delete') {
      if (!finder.selection.has(id)) selectFinderItem(id, grid);
      sendToTrash([...finder.selection].filter((item) => virtualEntries.has(item)));
      record.actions.focus();
    } else if (currentFolder() !== 'trash' && event.key === 'F2' && virtualEntries.has(id)) {
      nameEntry(id);
    } else return;
    event.preventDefault();
  });
  const groups = [
    ['Preferiti', ['desktop', 'documents', 'downloads', 'images']],
    ['Posizioni', ['local', 'trash']]
  ];
  for (const [label, entries] of groups) {
    const heading = document.createElement('h2');
    heading.className = 'sidebar-heading';
    heading.textContent = label;
    sidebar.append(heading);
    for (const id of entries) {
      const folder = folders[id];
      const entry = button(folder.name, 'sidebar-item', icon(folder.icon) + '<span>' + folder.name + '</span>', () => goToFolder(id));
      entry.dataset.folder = id;
      if (id !== 'local') bindFinderDrop(entry, id);
      sidebar.append(entry);
    }
  }
  updateFinder(record);
}

function updateSelection(grid) {
  for (const tile of grid.querySelectorAll('[data-item]')) {
    const selected = finder.selection.has(tile.dataset.item);
    tile.classList.toggle('is-selected', selected);
    tile.setAttribute('aria-pressed', selected);
  }
  const status = windows.get('finder').content.querySelector('.finder-footer').children[0];
  const count = folderItems(currentFolder()).length;
  status.textContent = finder.selection.size
    ? finder.selection.size + (finder.selection.size === 1 ? ' selezionato' : ' selezionati')
    : count + (count === 1 ? ' elemento' : ' elementi');
}

function selectFinderItem(id, grid, event = {}) {
  finderMessage = '';
  const items = displayItems();
  if (id && event.shiftKey && items.includes(finder.anchor)) {
    const first = items.indexOf(finder.anchor);
    const last = items.indexOf(id);
    finder.selection = new Set(items.slice(Math.min(first, last), Math.max(first, last) + 1));
  } else if (id && (event.ctrlKey || event.metaKey)) {
    if (finder.selection.has(id)) finder.selection.delete(id);
    else finder.selection.add(id);
    finder.anchor = id;
  } else {
    finder.selection = new Set(id ? [id] : []);
    finder.anchor = id;
  }
  updateSelection(grid);
}

function renderFinderTabs(container) {
  container.replaceChildren();
  for (const [index, tab] of finder.tabs.entries()) {
    const wrapper = document.createElement('div');
    wrapper.className = 'finder-tab';
    const id = tab.history[tab.index];
    const label = isVisibleEntry(id) ? folderInfo(id).name : 'Documenti';
    const selected = index === finder.activeTab;
    const tabButton = button(label, selected ? 'finder-tab-active' : '', '', () => {
      switchFinderTab(index);
      container.querySelector('.finder-tab-active')?.focus();
    });
    tabButton.textContent = label;
    tabButton.setAttribute('aria-current', selected ? 'true' : 'false');
    wrapper.append(tabButton);
    if (finder.tabs.length > 1) wrapper.append(iconButton('Chiudi scheda ' + (index + 1), 'close', () => closeFinderTab(index)));
    container.append(wrapper);
  }
  const add = iconButton('Nuova scheda', 'plus', () => newFinderTab());
  add.disabled = finder.tabs.length >= tabLimit;
  container.append(add);
}

function bindFinderDrop(element, destination) {
  const isDrag = (event) => finderDrag.length && event.dataTransfer.types.includes(finderDragType);
  element.addEventListener('dragover', (event) => {
    if (!isDrag(event) || finderDrag.includes(destination)) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    element.classList.toggle('is-drop-target', true);
  });
  element.addEventListener('dragleave', (event) => {
    if (!event.relatedTarget || !element.contains(event.relatedTarget)) element.classList.toggle('is-drop-target', false);
  });
  element.addEventListener('drop', (event) => {
    if (!isDrag(event)) return;
    event.preventDefault();
    event.stopPropagation();
    element.classList.toggle('is-drop-target', false);
    const ids = finderDrag;
    finderDrag = [];
    if (destination === 'trash') sendToTrash(ids);
    else if (destination !== currentFolder()) {
      const error = moveEntries(ids, destination);
      showFinderMessage(error || 'Elementi spostati in ' + folderInfo(destination).name + '.');
    }
  });
}

function bindFinderDrag(tile, id, grid) {
  tile.draggable = true;
  tile.addEventListener('dragstart', (event) => {
    if (!finder.selection.has(id)) selectFinderItem(id, grid);
    finderDrag = [...finder.selection].filter((item) => virtualEntries.has(item));
    event.dataTransfer.setData(finderDragType, id);
    event.dataTransfer.effectAllowed = 'move';
  });
  tile.addEventListener('dragend', () => {
    finderDrag = [];
    for (const target of document.querySelectorAll('.is-drop-target')) target.classList.toggle('is-drop-target', false);
  });
}

function updateFinder(record) {
  const id = currentFolder();
  const folder = folderInfo(id);
  const items = displayItems();
  finder.selection = new Set([...finder.selection].filter((item) => items.includes(item)));
  const surface = record.content;
  record.title.textContent = folder.name;
  record.backButton.disabled = historyIndex(-1) === finder.tab.index;
  record.forwardButton.disabled = historyIndex(1) === finder.tab.index;
  record.gridButton.setAttribute('aria-pressed', finder.view === 'grid');
  record.listButton.setAttribute('aria-pressed', finder.view === 'list');
  const nearestFavorite = ['documents', 'downloads', 'images', 'local', 'trash', 'desktop'].find((candidate) => insideFolder(id, candidate));
  for (const entry of surface.querySelectorAll('[data-folder]')) {
    const current = entry.dataset.folder === nearestFavorite;
    entry.setAttribute('aria-current', current ? 'location' : 'false');
  }
  const path = surface.querySelector('.finder-path');
  renderFinderTabs(surface.querySelector('.finder-tabs'));
  const ancestors = [];
  for (let parent = folderParent(id); parent && !ancestors.includes(parent); parent = folderParent(parent)) ancestors.unshift(parent);
  path.replaceChildren();
  for (const parent of ancestors) {
    const label = folderInfo(parent).name;
    const part = button(label, '', '', () => goToFolder(parent));
    part.textContent = label;
    path.append(part);
    path.insertAdjacentHTML('beforeend', icon('right'));
  }
  const current = document.createElement('strong');
  current.textContent = folder.name;
  path.append(current);
  const grid = surface.querySelector('.files');
  grid.classList.toggle('list-view', finder.view === 'list');
  grid.replaceChildren();
  for (const itemId of items) {
    const item = virtualEntries.get(itemId) ?? folders[itemId];
    const isFolder = item.kind === 'folder' || fixedFolders.includes(itemId);
    const kind = isFolder ? 'Cartella' : item.kind === 'import' ? 'File importato' : 'Documento';
    const tile = button(item.name + ' · ' + kind, 'file-tile', fileIcon(isFolder ? 'folder' : 'text') + '<span class="file-name"></span><span class="file-kind"></span>', (event) => {
      if (event.detail === 0 && id !== 'trash' && !event.ctrlKey && !event.metaKey && !event.shiftKey) {
        openItem(itemId);
        return;
      }
      selectFinderItem(itemId, grid, event);
      if (event.detail === 0 && id === 'trash') toggleMenu(record.actions, true, finderActions());
    });
    tile.dataset.item = itemId;
    tile.querySelector('.file-name').textContent = item.name;
    tile.querySelector('.file-kind').textContent = kind;
    tile.classList.toggle('is-selected', finder.selection.has(itemId));
    tile.setAttribute('aria-pressed', finder.selection.has(itemId));
    tile.addEventListener('dblclick', (event) => {
      if (!event.ctrlKey && !event.metaKey && !event.shiftKey) openItem(itemId);
    });
    if (isFolder && canWriteFolder(itemId)) bindFinderDrop(tile, itemId);
    if (id !== 'trash' && virtualEntries.has(itemId)) bindFinderDrag(tile, itemId, grid);
    grid.append(tile);
  }
  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = icon(folder.icon ?? 'folder') + '<h2></h2><p></p>';
    empty.querySelector('h2').textContent = id === 'local' ? 'Apri un file da Windows' : 'Nessun elemento';
    empty.querySelector('p').textContent = id === 'local'
      ? 'Scegli un singolo file per visualizzarne un’anteprima in sola lettura. Il file resta sul dispositivo.'
      : folder.empty ?? 'Usa il menu Azioni Finder per aggiungere un elemento.';
    if (id === 'local') {
      empty.append(button('Scegli file', 'primary-button', 'Scegli file…', () => byId('file-picker').click()));
    }
    grid.append(empty);
  }
  const [count, mode] = surface.querySelector('.finder-footer').children;
  count.textContent = finderMessage || (id === 'local' ? 'Selezione manuale' : items.length + (items.length === 1 ? ' elemento' : ' elementi'));
  if (finder.selection.size && !finderMessage) updateSelection(grid);
  mode.textContent = id === 'local' ? 'Accesso locale in sola lettura' : finderNotice || 'Disco virtuale';
}

function showFinderMessage(message) {
  finderMessage = message;
  byId('announcement').textContent = message;
  const record = windows.get('finder');
  if (record) updateFinder(record);
}

let finderSubmit = null;

function finderDialog(title, field, action, label = 'OK') {
  closeMenu();
  const dialog = byId('finder-dialog');
  byId('finder-dialog-title').textContent = title;
  byId('finder-dialog-field').replaceChildren(field);
  byId('finder-dialog-error').textContent = '';
  byId('finder-dialog-submit').textContent = label;
  finderSubmit = action;
  dialog.showModal();
  field.focus();
}

function nameEntry(id, kind) {
  const entry = virtualEntries.get(id);
  const parent = entry?.parent ?? currentFolder();
  const label = entry ? 'Rinomina elemento' : kind === 'folder' ? 'Nuova cartella' : 'Nuovo documento di testo';
  const field = document.createElement('input');
  field.type = 'text';
  field.maxLength = 120;
  field.setAttribute('aria-label', 'Nome');
  field.value = entry?.name ?? (kind === 'folder' ? 'Nuova cartella' : 'Senza titolo.txt');
  finderDialog(label, field, () => {
    const name = field.value.trim();
    const error = nameError(name, parent, id);
    if (error) return error;
    return entry ? updateEntry(id, { name }) : addEntry({ name, parent, kind, ...(kind === 'text' && { text: '' }) });
  }, entry ? 'Rinomina' : 'Crea');
  field.select();
}

function chooseDestination(id, restoring = false) {
  const ids = Array.isArray(id) ? id : [id];
  const field = document.createElement('select');
  field.setAttribute('aria-label', 'Cartella di destinazione');
  const candidates = [...fixedFolders, ...virtualEntries.keys()].filter((candidate) =>
    canWriteFolder(candidate) && ids.every((item) => !insideFolder(candidate, item))
    && (restoring || ids.some((item) => candidate !== virtualEntries.get(item).parent)));
  for (const candidate of candidates) {
    const labels = [];
    for (let folder = candidate; folder; folder = folderParent(folder)) labels.unshift(folderInfo(folder).name);
    const option = document.createElement('option');
    option.value = candidate;
    option.textContent = labels.join(' › ');
    field.append(option);
  }
  finderDialog(restoring ? 'Ripristina in…' : 'Sposta in…', field, () => moveEntries(ids, field.value), restoring ? 'Ripristina' : 'Sposta');
}

function sendToTrash(id) {
  const ids = Array.isArray(id) ? id : [id];
  if (!ids.length) return;
  const entries = new Map(virtualEntries);
  for (const item of ids) {
    const entry = entries.get(item);
    if (entry) entries.set(item, { ...entry, trashed: true });
  }
  const error = persistEntries(entries);
  if (!error && preview?.id && !isVisibleEntry(preview.id)) closeWindow(windows.get('preview'));
  showFinderMessage(error || (ids.length === 1 ? 'Elemento spostato nel Cestino.' : 'Elementi spostati nel Cestino.'));
}

function restoreEntry(id) {
  const entry = virtualEntries.get(id);
  if (!entry) return;
  const error = moveEntry(id, entry.parent);
  if (error) chooseDestination(id, true);
  else showFinderMessage('Elemento ripristinato.');
}

function confirmEmptyTrash() {
  const message = document.createElement('p');
  message.textContent = 'Gli elementi virtuali nel Cestino verranno eliminati definitivamente.';
  finderDialog('Svuotare il Cestino?', message, emptyTrash, 'Svuota');
}

function finderActions() {
  const id = finder.selected;
  const folder = currentFolder();
  const entry = virtualEntries.get(id);
  const selected = [...finder.selection].filter((item) => virtualEntries.has(item));
  if (folder === 'local') return [['Apri file in sola lettura…', () => byId('file-picker').click()]];
  if (folder === 'trash') return [
    ['Ripristina', () => restoreEntry(id), !entry],
    ['Svuota il Cestino…', confirmEmptyTrash, !folderItems('trash').length]
  ];
  return [
    ['Apri', () => openItem(id), !id],
    ['Anteprima rapida', openQuickLook, !finder.selection.size],
    ['Apri in una nuova scheda', () => newFinderTab(id), !canWriteFolder(id) || finder.tabs.length >= tabLimit],
    ['Nuova cartella…', () => nameEntry(null, 'folder')],
    ['Nuovo documento di testo…', () => nameEntry(null, 'text')],
    ['Importa copia da Windows…', () => {
      importDestination = folder;
      byId('import-picker').click();
    }],
    ['Rinomina…', () => nameEntry(id), !entry],
    ['Sposta in…', () => chooseDestination(selected), !selected.length],
    ['Esporta copia…', () => exportEntry(id), !entry || entry.kind === 'folder'],
    ['Sposta nel Cestino', () => sendToTrash(selected), !selected.length]
  ];
}

function clearPreview() {
  if (preview?.url) URL.revokeObjectURL(preview.url);
  preview = null;
}

const quickLook = byId('quicklook');
let quickLookUrl = null;
let quickLookItem = null;

function releaseQuickLook() {
  if (quickLookUrl) URL.revokeObjectURL(quickLookUrl);
  quickLookUrl = null;
}

function openQuickLook() {
  const ids = [...finder.selection].filter(isVisibleEntry);
  if (!ids.length) return;
  closeMenu();
  releaseQuickLook();
  const title = byId('quicklook-title');
  const content = byId('quicklook-content');
  const detail = byId('quicklook-detail');
  const open = byId('quicklook-open');
  content.replaceChildren();
  quickLookItem = ids.length === 1 ? ids[0] : null;
  open.hidden = !quickLookItem;
  if (!quickLookItem) {
    title.textContent = ids.length + ' elementi';
    detail.textContent = 'Selezione Finder';
    const list = document.createElement('ul');
    for (const id of ids) {
      const name = document.createElement('li');
      name.textContent = folderInfo(id).name;
      list.append(name);
    }
    content.append(list);
  } else {
    const item = folderInfo(quickLookItem);
    title.textContent = item.name;
    if (item.kind === 'folder' || fixedFolders.includes(quickLookItem)) {
      const names = folderItems(quickLookItem);
      detail.textContent = 'Cartella · ' + names.length + (names.length === 1 ? ' elemento' : ' elementi');
      content.innerHTML = fileIcon('folder');
    } else {
      const data = virtualPreview(quickLookItem);
      detail.textContent = data.description;
      if (data.url) {
        quickLookUrl = data.url;
        const image = document.createElement('img');
        image.alt = data.name;
        image.src = data.url;
        image.addEventListener('error', () => {
          image.remove();
          detail.textContent = 'Immagine illeggibile.';
        });
        content.append(image);
      } else if (data.text !== undefined) {
        const body = document.createElement('pre');
        body.textContent = data.text || 'Documento vuoto';
        content.append(body);
      } else {
        content.innerHTML = fileIcon('text');
      }
    }
  }
  quickLook.showModal();
  byId('quicklook-close').focus();
}

function showPreview(data) {
  clearPreview();
  preview = data;
  const existing = windows.get('preview');
  if (existing) existing.space = activeSpace;
  const record = openWindow('preview');
  if (existing) renderPreview(record);
}

function renderPreview(record) {
  if (!preview) return;
  record.title.textContent = preview.name;
  const content = document.createElement('div');
  content.className = 'preview-view';
  const description = document.createElement('p');
  description.className = 'app-hint';
  description.textContent = preview.description;
  content.append(description);
  const id = preview.id;
  if (isVisibleEntry(id) && virtualEntries.get(id)?.kind === 'text') {
    const editor = document.createElement('textarea');
    editor.className = 'document-editor';
    editor.setAttribute('aria-label', 'Testo del documento');
    editor.value = preview.text;
    editor.maxLength = limitBytes;
    editor.addEventListener('input', () => { description.textContent = 'Modifiche da salvare.'; });
    const controls = document.createElement('div');
    controls.className = 'document-controls';
    controls.append(button('Salva', 'primary-button', 'Salva', () => {
      const text = editor.value;
      if (new TextEncoder().encode(text).byteLength > limitBytes) {
        description.textContent = 'Il documento supera 256 KiB.';
        return;
      }
      if (!isVisibleEntry(id)) {
        description.textContent = 'Ripristina il documento dal Cestino prima di salvarlo.';
        return;
      }
      const error = updateEntry(id, { text });
      if (!error) {
        preview.text = text;
        record.title.textContent = virtualEntries.get(id).name;
      }
      description.textContent = error || finderNotice || 'Documento salvato nel disco virtuale.';
    }), button('Esporta copia', 'choice', 'Esporta', () => exportEntry(id)));
    content.append(editor, controls);
  } else if (preview.url) {
    const image = document.createElement('img');
    image.alt = preview.name;
    image.addEventListener('error', () => {
      image.remove();
      description.textContent += ' · Immagine illeggibile.';
    });
    image.src = preview.url;
    content.append(image);
  } else if (preview.text !== undefined) {
    const text = document.createElement('pre');
    text.textContent = preview.text;
    content.append(text);
  }
  record.content.replaceChildren(content);
}

async function openLocalFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';
  const selection = ++fileSelection;
  const size = new Intl.NumberFormat('it-IT').format(file.size);
  const data = { name: file.name, description: 'File locale · Sola lettura · ' + size + ' byte' };
  if (rasterType.test(file.type) && file.size <= 12 * 1024 * 1024) {
    data.url = URL.createObjectURL(file);
  } else if (file.type.startsWith('text/') || textExtension.test(file.name)) {
    const limit = limitBytes;
    try {
      data.text = await file.slice(0, limit).text();
      if (file.size > limit) data.description += ' · Primi 256 KiB';
    } catch {
      data.description += ' · Lettura non riuscita';
    }
  } else {
    data.description += ' · Solo informazioni sul file';
  }
  if (selection === fileSelection) showPreview(data);
}

function renderNotes(record) {
  const content = document.createElement('div');
  content.className = 'notes-view';
  const field = document.createElement('textarea');
  const status = document.createElement('p');
  status.className = 'app-hint';
  status.textContent = 'Gli appunti vengono salvati in questo browser quando la memoria locale è disponibile.';
  field.setAttribute('aria-label', 'Appunti');
  field.placeholder = 'Scrivi qui…';
  field.value = readValue('notes', '');
  field.addEventListener('input', () => {
    status.textContent = writeValue('notes', field.value)
      ? 'Appunti salvati in questo browser.'
      : 'Appunti disponibili fino alla chiusura della pagina.';
  });
  content.append(field, status);
  record.content.append(content);
}

function renderCalculator(record) {
  const content = document.createElement('div');
  content.className = 'calculator-view';
  const display = document.createElement('output');
  display.setAttribute('aria-label', 'Risultato');
  const keyboard = document.createElement('div');
  keyboard.className = 'calculator-keys';
  const operations = {
    '+': (left, right) => left + right,
    '−': (left, right) => left - right,
    '×': (left, right) => left * right,
    '÷': (left, right) => left / right
  };
  let value = '0';
  let accumulator = null;
  let pending = null;
  let replace = true;

  function format(number) {
    return Number.isFinite(number) ? String(Number(number.toPrecision(12))) : 'Errore';
  }

  function press(key) {
    if (key === 'AC') {
      value = '0';
      accumulator = null;
      pending = null;
      replace = true;
    } else if (/^\d$/.test(key) || key === ',') {
      if (replace || value === 'Errore') value = '0';
      if (key === ',' && !value.includes('.')) value += '.';
      if (key !== ',' && value.length < 14) value = value === '0' ? key : value + key;
      replace = false;
    } else if (key === '±' || key === '%') {
      if (value === 'Errore') return;
      value = format(Number(value) * (key === '±' ? -1 : .01));
      replace = false;
    } else if (key === '=' || operations[key]) {
      if (value === 'Errore') return;
      if (pending && !replace) value = format(operations[pending](accumulator, Number(value)));
      pending = key === '=' || value === 'Errore' ? null : key;
      accumulator = pending ? Number(value) : null;
      replace = true;
    }
    display.textContent = value.replace('.', ',');
  }

  for (const key of ['AC', '±', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '0', ',', '=']) {
    const labels = { AC: 'Azzera', '±': 'Cambia segno', '%': 'Percentuale', '÷': 'Dividi', '×': 'Moltiplica', '−': 'Sottrai', '+': 'Somma', ',': 'Virgola decimale', '=': 'Uguale' };
    const entry = button(labels[key] ?? key, operations[key] || key === '=' ? 'operation' : '', key, () => press(key));
    if (key === '0') entry.style.gridColumn = 'span 2';
    keyboard.append(entry);
  }
  display.textContent = value;
  content.append(display, keyboard);
  record.content.append(content);
}

const preferences = {
  theme: { title: 'Aspetto', choices: { light: 'Chiaro', dark: 'Scuro' } },
  wallpaper: { title: 'Sfondo', choices: {
    laguna: 'Laguna', aurora: 'Aurora', tramonto: 'Tramonto',
    'pro-m6': 'MacBook Pro M6', 'imac-m6': 'iMac M6', 'pro-xdr': 'MacBook Pro PROLED XDR',
    personal: 'Personale'
  } },
  motion: { title: 'Animazioni', choices: { system: 'Come il sistema', reduced: 'Ridotte' } }
};
const macWallpapers = ['pro-m6', 'imac-m6', 'pro-xdr'];
const originalWallpapers = [
  ['MacBook Pro PROLED XDR', 'https://www.iclarified.com/103161/download-the-official-macbook-pro-proled-xdr-wallpaper'],
  ['macOS 27 Golden Gate', 'https://www.iclarified.com/101095/download-the-official-macos-27-golden-gate-wallpaper-for-mac']
];
const personalWallpaperLimit = 900000;
const wallpaperFormat = /^data:image\/jpeg;base64,[A-Za-z0-9+/]+={0,2}$/;
let wallpaperSelection = 0;

function readPersonalWallpaper() {
  return personalWallpaper(activeSpace);
}

function personalWallpaper(space) {
  const image = readValue('wallpaper.image.' + space, readValue('wallpaper.personal', ''));
  return image.length <= personalWallpaperLimit && wallpaperFormat.test(image) ? image : '';
}

function spaceWallpaper(space) {
  const value = readValue('wallpaper.space.' + space, readValue('wallpaper', 'laguna'));
  return Object.hasOwn(preferences.wallpaper.choices, value) && (value !== 'personal' || personalWallpaper(space)) ? value : 'laguna';
}

function saveWallpaper(value, space = activeSpace) {
  const stored = writeValue('wallpaper.space.' + space, value);
  if (space === activeSpace) applyPreference('wallpaper', value);
  return stored;
}

function syncWallpaper() {
  applyPreference('wallpaper', spaceWallpaper(activeSpace));
  const settings = windows.get('settings');
  if (settings) renderSettings(settings);
}

function availableWallpapers() {
  return Object.keys(preferences.wallpaper.choices).filter((key) => key !== 'personal' || readPersonalWallpaper());
}

function applyPreference(key, value) {
  if (!Object.hasOwn(preferences[key].choices, value)) return;
  if (key === 'wallpaper') {
    const personal = value === 'personal' ? readPersonalWallpaper() : '';
    if (value === 'personal' && !personal) value = 'laguna';
    const layer = byId('wallpaper-image');
    layer.dataset.art = value;
    layer.hidden = !personal && !macWallpapers.includes(value);
    layer.style.backgroundImage = personal ? 'url("' + personal + '")' : '';
  }
  document.documentElement.dataset[key] = value;
}

function chooseWallpaper(key, status, group) {
  wallpaperSelection += 1;
  status.textContent = saveWallpaper(key)
    ? 'Sfondo salvato in questo browser.'
    : 'Sfondo applicato a questa sessione.';
  for (const choice of group.querySelectorAll('[data-wallpaper-key]')) {
    choice.setAttribute('aria-pressed', choice.dataset.wallpaperKey === key);
  }
}

function renderWallpaperSettings(status) {
  const group = document.createElement('fieldset');
  const title = document.createElement('legend');
  title.textContent = 'Sfondo · ' + spaceName(activeSpace);
  group.append(title);
  const choices = availableWallpapers();
  for (const [label, keys] of [
    ['Ispirati ai Mac 2026', macWallpapers],
    ['Collezione Laguna', choices.filter((key) => !macWallpapers.includes(key))]
  ]) {
    const heading = document.createElement('p');
    heading.className = 'wallpaper-heading';
    heading.textContent = label;
    const gallery = document.createElement('div');
    gallery.className = 'wallpaper-gallery';
    for (const key of keys) {
      const name = preferences.wallpaper.choices[key];
      const option = button(name, 'wallpaper-option', '<span class="wallpaper-sample" aria-hidden="true"></span><span class="wallpaper-name"></span>', () => chooseWallpaper(key, status, group));
      option.dataset.wallpaperKey = key;
      const sample = option.querySelector('.wallpaper-sample');
      sample.dataset.art = key;
      if (key === 'personal') sample.style.backgroundImage = 'url("' + readPersonalWallpaper() + '")';
      option.querySelector('.wallpaper-name').textContent = name;
      option.setAttribute('aria-pressed', document.documentElement.dataset.wallpaper === key);
      gallery.append(option);
    }
    group.append(heading, gallery);
  }
  const source = document.createElement('details');
  source.className = 'wallpaper-source';
  const summary = document.createElement('summary');
  summary.textContent = 'Scarica gli sfondi Apple';
  source.append(summary);
  for (const [name, url] of originalWallpapers) {
    const link = document.createElement('a');
    link.textContent = name + ' ↗';
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.append(link);
  }
  const importImage = button('Scegli immagine', 'choice wallpaper-import', icon('image') + '<span>Scegli immagine…</span>', () => byId('wallpaper-picker').click());
  group.append(importImage, source);
  return group;
}

async function importWallpaper(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  const selection = ++wallpaperSelection;
  const space = activeSpace;
  try {
    if (!rasterType.test(file.type) || file.size > 24 * 1024 * 1024) {
      reportWallpaper('Scegli un’immagine JPG, PNG, WebP, GIF, BMP o AVIF fino a 24 MiB.');
      return;
    }
    const bitmap = await createImageBitmap(file);
    const canvas = document.createElement('canvas');
    try {
      const scale = Math.min(1, 1920 / Math.max(bitmap.width, bitmap.height));
      canvas.width = Math.max(1, Math.round(bitmap.width * scale));
      canvas.height = Math.max(1, Math.round(bitmap.height * scale));
      const painter = canvas.getContext('2d', { alpha: false });
      painter.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    } finally {
      bitmap.close();
    }
    let image = '';
    for (const quality of [.85, .72, .56]) {
      image = canvas.toDataURL('image/jpeg', quality);
      if (image.length <= personalWallpaperLimit && wallpaperFormat.test(image)) break;
    }
    if (selection !== wallpaperSelection || !spaces.includes(space)) return;
    if (image.length > personalWallpaperLimit || !wallpaperFormat.test(image)) {
      reportWallpaper('L’immagine è troppo dettagliata per essere salvata. Prova una copia più piccola.');
      return;
    }
    const stored = writeValue('wallpaper.image.' + space, image);
    const selected = saveWallpaper('personal', space);
    reportWallpaper(stored && selected ? 'Sfondo personale salvato per ' + spaceName(space) + '.' : 'Sfondo personale disponibile in questa sessione.');
  } catch {
    if (selection === wallpaperSelection) reportWallpaper('Impossibile aprire questa immagine.');
  }
}

function reportWallpaper(message) {
  byId('announcement').textContent = message;
  const settings = windows.get('settings');
  if (!settings) return;
  renderSettings(settings);
  settings.content.querySelector('.wallpaper-status').textContent = message;
  settings.content.querySelector('.wallpaper-import').focus({ preventScroll: true });
}

function renderSettings(record) {
  const content = document.createElement('div');
  content.className = 'settings-view';
  const status = document.createElement('p');
  status.className = 'app-hint wallpaper-status';
  status.setAttribute('role', 'status');
  content.append(status);
  for (const [key, preference] of Object.entries(preferences)) {
    if (key === 'wallpaper') {
      content.append(renderWallpaperSettings(status));
      continue;
    }
    const group = document.createElement('fieldset');
    const legend = document.createElement('legend');
    legend.textContent = preference.title;
    const options = document.createElement('div');
    options.className = 'settings-options';
    for (const [value, label] of Object.entries(preference.choices)) {
      const choice = button(label, 'choice', label, () => {
        applyPreference(key, value);
        status.textContent = writeValue(key, value)
          ? 'Preferenza salvata in questo browser.'
          : 'Preferenza applicata a questa sessione.';
        for (const entry of options.children) entry.setAttribute('aria-pressed', entry === choice);
      });
      choice.setAttribute('aria-pressed', document.documentElement.dataset[key] === value);
      options.append(choice);
    }
    group.append(legend, options);
    content.append(group);
  }
  content.append(renderDockSettings());
  record.content.replaceChildren(content);
}

function renderInfo(record) {
  record.content.innerHTML = '<div class="info-view"><h2>Laguna 1.5</h2><p>Dal menu di sistema, scegli <strong>Modifica widget</strong> per aggiungere Orologio, Calendario o Promemoria. Trascina il titolo di un widget per spostarlo.</p><p>In <strong>Mission Control</strong> puoi passare tra le scrivanie. Ciascuna ha il suo sfondo e i suoi widget.</p><p><kbd>Ctrl</kbd> + <kbd>Spazio</kbd> apre Spotlight. <kbd>F11</kbd> attiva o disattiva lo schermo intero.</p></div>';
}

const launchpad = byId('launchpad');
const launchSearch = byId('launch-search');
const spotlight = byId('spotlight');
const spotlightSearch = byId('spotlight-search');
const mission = byId('mission');
const controlCenter = byId('control-center');
let searchResults = [];
let selectedResult = 0;

function normalize(text) {
  return text.toLocaleLowerCase('it').normalize('NFD').replace(/\p{Diacritic}/gu, '').trim();
}

function renderLaunchpad() {
  const query = normalize(launchSearch.value);
  const grid = byId('launch-grid');
  const matches = launchApps.filter((id) => normalize(appName(id)).includes(query));
  grid.replaceChildren();
  for (const id of matches) {
    grid.append(button(appName(id), 'launch-item', appIcon(id) + '<span>' + appName(id) + '</span>', () => {
      launchpad.close();
      launch(id);
    }));
  }
  if (!matches.length) grid.append(noResults('Nessuna app trovata'));
}

function openLaunchpad() {
  closeMenu();
  if (spotlight.open) spotlight.close();
  launchSearch.value = '';
  renderLaunchpad();
  if (!launchpad.open) launchpad.showModal();
  launchSearch.focus();
}

function noResults(message) {
  const empty = document.createElement('p');
  empty.className = 'no-results';
  empty.textContent = message;
  return empty;
}

const appSearch = [...launchApps, 'launchpad', 'mission'].map((id) => ({
    name: appName(id), detail: 'App', art: appIcon(id), open: () => launch(id)
}));

function searchableEntries() {
  return [
    ...appSearch,
    ...fixedFolders.filter((id) => id !== 'local').map((id) => ({
      name: folders[id].name, detail: 'Cartella virtuale', art: fileIcon('folder'), open: () => showFolder(id)
    })),
    ...[...virtualEntries].filter(([id]) => isVisibleEntry(id)).map(([id, entry]) => ({
      name: entry.name,
      detail: (entry.kind === 'folder' ? 'Cartella' : 'Documento') + ' · ' + folderInfo(entry.parent).name,
      art: fileIcon(entry.kind === 'folder' ? 'folder' : 'text'),
      open: () => openItem(id)
    }))
  ];
}

function chooseResult(index, scroll = false) {
  const items = [...byId('spotlight-results').querySelectorAll('button')];
  if (!items.length) {
    spotlightSearch.removeAttribute('aria-activedescendant');
    return;
  }
  selectedResult = (index + items.length) % items.length;
  items.forEach((item, position) => {
    const selected = position === selectedResult;
    item.classList.toggle('is-selected', selected);
    item.setAttribute('aria-selected', selected);
  });
  const item = items[selectedResult];
  spotlightSearch.setAttribute('aria-activedescendant', item.id);
  if (scroll) item.scrollIntoView({ block: 'nearest' });
}

function runResult(index) {
  const result = searchResults[index];
  if (!result) return;
  spotlight.close();
  result.open();
}

function renderSpotlight() {
  const query = normalize(spotlightSearch.value);
  searchResults = query
    ? searchableEntries().filter((entry) => normalize(entry.name + ' ' + entry.detail).includes(query)).slice(0, 9)
    : appSearch.slice(0, 5);
  const list = byId('spotlight-results');
  list.replaceChildren();
  searchResults.forEach((result, index) => {
    const item = button(result.name + ' · ' + result.detail, 'spotlight-item', result.art, () => runResult(index));
    const label = document.createElement('span');
    label.textContent = result.name;
    const detail = document.createElement('small');
    detail.textContent = result.detail;
    label.append(detail);
    item.append(label);
    item.id = 'result-' + index;
    item.tabIndex = -1;
    item.setAttribute('role', 'option');
    list.append(item);
  });
  byId('spotlight-caption').textContent = searchResults.length ? 'App e file del simulatore' : 'Nessun risultato';

function toggleSpotlight() {

function renderControlCenter(focus = null) {
  const content = byId('control-options');

  const reduced = document.documentElement.dataset.motion === 'reduced';
