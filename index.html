  <style>
:root {
  color-scheme: light;
  font-family: Inter, "Segoe UI", sans-serif;
  --ink: #19272e;
  --muted: #5a6c76;
  --surface: #fafbfc;
  --panel: #fff;
  --sidebar: #eaf0f3;
  --line: #e1e7eb;
  --hover: #edf3f6;
  --selected: #dcebf8;
  --accent: #1263a9;
  --menu-height: 34px;
  --dock-height: 88px;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ink: #eaf2f7;
  --muted: #afbec8;
  --surface: #20292f;
  --panel: #182126;
  --sidebar: #252f37;
  --line: #34424c;
  --hover: #2b3a45;
  --selected: #294863;
  --accent: #83c3fb;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; overflow: hidden; color: var(--ink); background: #17434d; }
button, input, textarea { font: inherit; }
button { color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .36; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #2589d8; outline-offset: 2px; }
button, h1, h2, p { margin: 0; }
[hidden] { display: none !important; }
.glyph { width: 1.15em; height: 1.15em; display: block; flex: none; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

#wallpaper { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 73% 18%, #b6e3c6 0%, #70bcb1 24%, #317d83 59%, #153842 100%); }
#wallpaper i { position: absolute; display: block; pointer-events: none; }
#wallpaper i:nth-child(1) { inset: 17% -20% -25% -15%; border-radius: 55% 38% 0 0; transform: rotate(-16deg); background: linear-gradient(156deg, #2f7f85 6%, #1d5e68 44%, #102d3b 82%); box-shadow: inset 0 1px 0 #9ad8ca60; }
#wallpaper i:nth-child(2) { inset: 40% -25% -30% -42%; border-radius: 43% 63% 0 0; transform: rotate(13deg); background: linear-gradient(155deg, #72c1b2 2%, #387f87 30%, #123743 63%); box-shadow: inset 0 2px 0 #a6dfd04d; }
#wallpaper i:nth-child(3) { inset: 55% -32% -34% 16%; border-radius: 71% 25% 0 0; transform: rotate(-18deg); background: linear-gradient(151deg, #478e90, #2a6876 33%, #112d3c 73%); box-shadow: inset 0 1px 0 #a6dfd04d; }
#wallpaper i:nth-child(4) { inset: 78% -20% -50% -30%; border-radius: 48% 55% 0 0; transform: rotate(7deg); background: linear-gradient(166deg, #22525e, #0d2838 60%); box-shadow: inset 0 1px 0 #6eafad42; }
#wallpaper i:nth-child(5) { inset: 0; background: radial-gradient(ellipse at 57% 38%, transparent 20%, #061f3b42 100%); }
:root[data-wallpaper="aurora"] #wallpaper { filter: hue-rotate(62deg) saturate(.85); }
:root[data-wallpaper="tramonto"] #wallpaper { filter: hue-rotate(190deg) saturate(.8); }
#wallpaper-image { position: absolute; inset: 0; }
#wallpaper-image, .wallpaper-sample { background-position: center; background-size: cover; background-repeat: no-repeat; background-color: #101a2c; overflow: hidden; isolation: isolate; }
[data-art="pro-m6"] {
  background-image:
    radial-gradient(ellipse at 67% 30%, #7f96b24d 0%, transparent 28%),
    radial-gradient(ellipse at 49% 60%, #000 0 23%, #152034 24%, #6e839c 26%, #b8c9d8 27%, #43556b 29%, #111a2a 34%, transparent 48%),
    radial-gradient(ellipse at 64% 55%, #010207 0 35%, #6a7d93 37%, #25334c 39%, transparent 59%),
    linear-gradient(140deg, #060810 13%, #202f48 53%, #05070e 82%);
}
[data-art="imac-m6"] {
  background-image:
    radial-gradient(ellipse at 11% 14%, #a9edff94, transparent 43%),
    radial-gradient(ellipse at 71% 76%, transparent 0 27%, #bdc5fc 28%, #8e8bea 34%, #4366ce 38%, #233d93 40%, transparent 43%),
    radial-gradient(ellipse at 91% 27%, #edddff 0 13%, #9d8be6 19%, #4f67cc 26%, #3e73c6 29%, transparent 43%),
    radial-gradient(ellipse at 21% 87%, #224899 0%, #3e75cb 26%, #5ea8e6 32%, #9fd6ed 38%, transparent 44%),
    linear-gradient(138deg, #1d5caa 5%, #687bd4 47%, #342369 100%);
}
[data-art="pro-xdr"] {
  background-image:
    radial-gradient(ellipse at 74% 48%, #102a4c, transparent 54%),
    radial-gradient(ellipse at 27% 60%, #132138, transparent 40%),
    linear-gradient(120deg, #03050a, #090e18 59%, #010204);
}
[data-art="pro-xdr"]::before {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, #6582a400 0 1%, #c7ddf873 1.15%, #82b9ea16 1.32% 2.3%),
    linear-gradient(98deg, #12253d 12%, #bbd4e9 44%, #e3f0ff 52%, #336ba2 70%, #95bfdc 80%, #292137 94%);
  mask-image: radial-gradient(ellipse at 31% 44%, transparent 0 17%, black 19% 21%, transparent 24% 31%, black 33% 35%, transparent 40%),
    radial-gradient(ellipse at 75% 59%, transparent 0 16%, black 18% 21%, transparent 24% 30%, black 31% 32%, transparent 35%);
  opacity: .95;
}
.wallpaper-sample[data-art="laguna"] { background-image: radial-gradient(ellipse at 75% 16%, #b6e3c6, #70bcb1 25%, #317d83 58%, #153842 92%); }
.wallpaper-sample[data-art="aurora"] { background-image: radial-gradient(ellipse at 75% 16%, #c3d7ef, #799ac7 25%, #354982 58%, #252842 92%); }
.wallpaper-sample[data-art="tramonto"] { background-image: radial-gradient(ellipse at 75% 16%, #f1c2c7, #b26c73 25%, #834747 58%, #4b2a38 92%); }

#menubar { position: fixed; z-index: 30; inset: 0 0 auto; height: var(--menu-height); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; color: #f7fcff; background: #1538429c; border-bottom: 1px solid #ffffff2c; backdrop-filter: blur(20px) saturate(145%); user-select: none; }
#menus, #status-bar { display: flex; align-items: center; gap: 2px; min-width: 0; }
.menu-button { height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; font-size: 12.5px; white-space: nowrap; }
.menu-button:hover, .menu-button[aria-expanded="true"] { background: #ffffff24; }
.system-mark { font-size: 19px; padding: 0 9px; }
#app-menu { font-weight: 700; }
.status-button { display: grid; place-items: center; font-size: 15px; }
#clock { padding: 0 4px 0 9px; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#menu-popover { position: fixed; z-index: 31; top: calc(var(--menu-height) + 4px); min-width: 218px; max-width: calc(100vw - 12px); max-height: calc(100vh - 12px); overflow: auto; padding: 5px; border: 1px solid var(--line); border-radius: 10px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(20px) saturate(135%); box-shadow: 0 12px 34px #05172244; }
#menu-popover button { display: block; width: 100%; padding: 7px 10px; text-align: left; border: 0; border-radius: 5px; background: transparent; font-size: 13px; }
#menu-popover button:not(:disabled):hover { background: var(--selected); }

#desktop { position: fixed; inset: var(--menu-height) 0 var(--dock-height); }
#desktop-icons { position: absolute; inset: 16px 15px auto auto; display: grid; gap: 11px; }
.desktop-item { display: grid; width: 96px; justify-items: center; gap: 6px; padding: 8px 2px; background: none; border: 1px solid transparent; border-radius: 10px; color: #fff; text-shadow: 0 1px 4px #032432; font-size: 12px; }
.desktop-item:hover, .desktop-item:focus-visible { background: #ffffff22; border-color: #ffffff3b; }
.desktop-item .file-icon { width: 51px; height: 42px; }
.desktop-item .drive-icon { width: 46px; height: 39px; margin-block: 2px 1px; }
#windows { position: absolute; inset: 0; pointer-events: none; }
.window { position: absolute; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; pointer-events: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; box-shadow: 0 17px 52px #031f3c45, 0 3px 9px #021e322d; }
.window.is-active { box-shadow: 0 24px 70px #041e365e, 0 4px 14px #031d3545; }
.window.is-maximized { border-radius: 8px; }
.titlebar { flex: 0 0 58px; display: flex; align-items: center; gap: 16px; min-width: 0; padding: 0 15px; background: var(--surface); border-bottom: 1px solid var(--line); user-select: none; touch-action: none; cursor: grab; }
.titlebar:active { cursor: grabbing; }
.traffic { display: flex; gap: 8px; flex: none; }
.traffic button { position: relative; width: 13px; height: 13px; display: grid; place-items: center; border: 1px solid #1a211f23; border-radius: 50%; padding: 0; background: var(--light); color: #182723; font: bold 10px/1 "Segoe UI", sans-serif; }
.traffic button span { position: absolute; opacity: 0; }
.traffic:hover button span, .traffic button:focus-visible span { opacity: 1; }
.window:not(.is-active) .traffic button:not(:hover):not(:focus-visible) { background: #aab8c16b; }
.title-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 700; }
.window-content { flex: 1; min-width: 0; min-height: 0; overflow: auto; background: var(--panel); }
.resize-handle { position: absolute; z-index: 2; touch-action: none; }
.resize-handle[data-edge="right"] { inset: 12px 0 13px auto; width: 5px; cursor: ew-resize; }
.resize-handle[data-edge="bottom"] { inset: auto 13px 0 12px; height: 5px; cursor: ns-resize; }
.resize-handle[data-edge="corner"] { inset: auto 0 0 auto; width: 13px; height: 13px; cursor: nwse-resize; }
.resize-handle[data-edge="corner"]::after { content: ""; position: absolute; right: 3px; bottom: 3px; width: 5px; height: 5px; border: solid var(--muted); border-width: 0 1px 1px 0; opacity: .55; }
.is-maximized .resize-handle { display: none; }

.icon-button { display: grid; place-items: center; width: 30px; height: 29px; flex: none; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 15px; }
.icon-button:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.icon-button[aria-pressed="true"] { background: var(--selected); color: var(--accent); }
.finder-navigation, .view-buttons { display: flex; align-items: center; gap: 3px; }
.window[data-window="finder"] { --finder-sidebar-width: 180px; }
.window[data-window="finder"] .titlebar { gap: 11px; background: linear-gradient(to right, var(--sidebar) var(--finder-sidebar-width), var(--surface) var(--finder-sidebar-width)); }
.window[data-window="finder"] .traffic { width: calc(var(--finder-sidebar-width) - 17px); }
.view-buttons { padding: 2px; border: 1px solid var(--line); border-radius: 8px; }
.view-buttons .icon-button { height: 26px; }
.finder-body { display: flex; height: 100%; overflow: hidden; }
.finder-sidebar { flex: 0 0 var(--finder-sidebar-width); padding: 18px 11px; overflow: auto; background: var(--sidebar); border-right: 1px solid var(--line); }
.sidebar-heading { margin: 6px 9px 8px; color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .085em; }
.sidebar-heading:not(:first-child) { margin-top: 22px; }
.sidebar-item { display: flex; align-items: center; gap: 9px; width: 100%; border: 0; border-radius: 7px; padding: 8px 9px; text-align: left; background: transparent; font-size: 12.5px; white-space: nowrap; }
.sidebar-item .glyph { color: var(--accent); font-size: 15px; }
.sidebar-item:hover { background: var(--hover); }
.sidebar-item[aria-current="location"] { background: var(--selected); font-weight: 650; }
.finder-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.finder-tabs { display: flex; flex: none; align-items: center; gap: 4px; overflow-x: auto; padding: 4px 7px; background: var(--sidebar); border-bottom: 1px solid var(--line); }
.finder-tab { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; padding: 1px 2px; border-radius: 7px; }
.finder-tab:has(.finder-tab-active) { background: var(--surface); box-shadow: 0 1px 3px #071c311c; }
.finder-tab > button:first-child { max-width: 160px; height: 26px; padding: 0 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; border: 0; border-radius: 6px; font-size: 12px; }
.finder-tab > button:first-child:hover { background: var(--hover); }
.finder-tab-active { font-weight: 650; }
.finder-tabs .icon-button { width: 25px; height: 25px; font-size: 13px; }
.finder-path { display: flex; align-items: center; gap: 6px; min-height: 37px; padding: 5px 17px; overflow-x: auto; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.finder-path button { background: transparent; color: var(--accent); border: 0; border-radius: 4px; padding: 3px 5px; white-space: nowrap; }
.finder-path button:hover { background: var(--hover); }
.finder-path strong { flex: none; white-space: nowrap; color: var(--ink); font-weight: 650; }
.finder-path > .glyph { font-size: 11px; }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); align-content: start; gap: 9px; flex: 1; overflow: auto; padding: 21px 17px; }
.files.list-view { grid-template-columns: minmax(0, 1fr); gap: 3px; padding-block: 10px; }
.file-tile { display: grid; min-width: 0; justify-items: center; align-content: start; gap: 9px; padding: 10px 5px; border: 1px solid transparent; border-radius: 9px; background: none; text-align: center; touch-action: manipulation; }
.file-tile:hover { background: var(--hover); }
.file-tile.is-selected { background: var(--selected); border-color: var(--line); }
.file-tile[draggable="true"] { user-select: none; }
.file-tile.is-drop-target, .sidebar-item.is-drop-target, .space-tile.is-drop-target { background: var(--selected); outline: 2px solid #338cd3; outline-offset: -2px; }
.dock-item.is-drop-target .app-icon { transform: translateY(-10px) scale(1.29); outline: 2px solid #8dd5ff; outline-offset: 2px; }
.file-name { min-width: 0; max-width: 100%; overflow-wrap: anywhere; font-size: 12px; line-height: 1.35; }
.file-kind { display: none; color: var(--muted); font-size: 11px; }
.file-icon { width: 62px; height: 50px; display: block; flex: none; overflow: visible; }
.list-view .file-tile { grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; justify-items: start; gap: 10px; padding: 5px 9px; text-align: left; }
.list-view .file-icon { width: 28px; height: 25px; }
.list-view .file-kind { display: block; }
.finder-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 5px 12px; min-height: 35px; padding: 6px 17px; color: var(--muted); background: var(--surface); border-top: 1px solid var(--line); font-size: 11px; }
.finder-footer span:last-child { display: flex; align-items: center; gap: 6px; }
.finder-footer span:last-child::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #46a993; }
.empty-state { grid-column: 1 / -1; align-self: start; justify-self: center; width: min(100%, 370px); padding: 24px 8px; text-align: center; }
.empty-state > .glyph { margin: 0 auto 15px; font-size: 33px; color: var(--accent); }
.empty-state h2 { margin-bottom: 8px; font-size: 17px; }
.empty-state p { margin-bottom: 15px; font-size: 13px; line-height: 1.55; color: var(--muted); }
.primary-button { border: 0; border-radius: 7px; padding: 8px 13px; background: #1769ac; color: white; font-size: 12px; font-weight: 650; }
.primary-button:hover { background: #0e5591; }

#dock { position: fixed; z-index: 25; inset: auto auto 10px 50%; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 9px; height: 68px; max-width: calc(100vw - 14px); padding: 7px 10px 9px; border: 1px solid #d9f2f34f; border-radius: 19px; background: #c4dbe14a; box-shadow: 0 10px 35px #061e3566, inset 0 1px 0 #ffffff21; backdrop-filter: blur(13px); }
#dock-reveal { position: fixed; z-index: 24; bottom: 0; left: 50%; width: min(220px, 54vw); height: 18px; transform: translateX(-50%); border: 0; border-radius: 8px 8px 0 0; background: #0c2b3b78; }
#dock-reveal::after { content: ""; display: block; width: 33px; height: 3px; margin: auto; border-radius: 3px; background: #d8edf6bf; }
#dock-area[data-autohide="true"] #dock { transition: transform .2s ease; }
#dock-area[data-autohide="true"][data-revealed="false"]:not(.finder-reveal):not(:hover) #dock:not(:focus-within) { transform: translate(-50%, calc(100% + 12px)); }
#dock-area[data-autohide="true"]:hover #dock { transition-duration: .1s; }
.dock-item { position: relative; flex: none; display: grid; place-items: center; width: 47px; height: 48px; padding: 0; border: 0; border-radius: 11px; background: none; }
.dock-item[data-dock-drop]::before { content: ""; position: absolute; inset: 4px auto 4px -5px; width: 2px; border-radius: 2px; background: #bcf2ff; pointer-events: none; }
.dock-item[data-dock-drop="after"]::before { inset-inline: auto -5px; }
.dock-item .app-icon { transition: transform .18s cubic-bezier(.2,.8,.3,1.35); transform-origin: center bottom; }
.dock-item:hover .app-icon, .dock-item:focus-visible .app-icon { transform: translateY(-9px) scale(1.29); }
.dock-item:has(+ .dock-item:hover) .app-icon, .dock-item:hover + .dock-item .app-icon { transform: translateY(-4px) scale(1.1); }
.dock-item.is-open::after { content: ""; position: absolute; bottom: -7px; left: calc(50% - 2px); width: 4px; height: 4px; border-radius: 50%; background: #f6fdff; }
.dock-item .dock-tooltip { position: absolute; bottom: calc(100% + 17px); left: 50%; transform: translateX(-50%); pointer-events: none; padding: 5px 9px; border: 1px solid #ffffff33; border-radius: 6px; background: #172d37ed; color: white; font-size: 11px; white-space: nowrap; opacity: 0; }
.dock-item:hover .dock-tooltip, .dock-item:focus-visible .dock-tooltip { opacity: 1; }
.dock-divider { width: 1px; height: 38px; margin: 0 1px 5px; background: #ffffff46; }
.app-icon { display: grid; width: 100%; height: 100%; place-items: center; overflow: hidden; border: 1px solid #ffffff5c; border-radius: 24%; color: #fff; box-shadow: inset 0 1px 1px #ffffff59, 0 2px 5px #08233548; }
.app-icon > .glyph { width: 64%; height: 64%; }
.app-icon.finder { background: linear-gradient(155deg, #78d8ff, #2b85f4); border: 0; }
.app-icon.finder > svg { width: 100%; height: 100%; }
.app-icon.launchpad { background: linear-gradient(145deg, #e6effc, #99a9c6 57%, #7687aa); color: #2b4169; }
.app-icon.mission { background: linear-gradient(155deg, #79c9ed, #597dbb 55%, #34496e); }
.app-icon.notes { background: linear-gradient(#ffd460 0 24%, #fff6d9 25%, #fffdf4 100%); color: #9a6a19; }
.app-icon.calculator { background: linear-gradient(155deg, #566273, #222b39); color: #ffe0a4; }
.app-icon.settings { background: linear-gradient(155deg, #e9eef3, #9eacbe 65%, #798b9f); color: #304050; }
.app-icon.preview { background: linear-gradient(155deg, #7edebd, #2b8a88); }
.app-icon.trash { background: linear-gradient(155deg, #f3fbff, #b5d1dd); color: #537084; }
.app-icon.info { background: linear-gradient(155deg, #76cbbb, #33758a); }
.dock-item.has-items .app-icon.trash { background: linear-gradient(155deg, #f9fbff, #9fbed4); color: #294d67; }
.dock-item.has-items::before { content: ""; position: absolute; z-index: 1; bottom: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: #3189bf; pointer-events: none; }

dialog { color: var(--ink); padding: 0; border: 1px solid var(--line); background: var(--surface); }
dialog::backdrop { background: #081f31a1; }
#launchpad { width: min(760px, calc(100% - 28px)); max-height: calc(100% - 60px); padding: 18px 24px 29px; border-color: #ffffff47; border-radius: 20px; background: #163942f2; color: #fff; box-shadow: 0 25px 80px #00152388; }
.launch-top { display: flex; justify-content: center; position: relative; padding: 4px 30px 17px; }
.launch-top .search-field { width: min(280px, 100%); padding: 9px 12px; background: #ffffff19; border: 1px solid #ffffff28; border-radius: 8px; }
.search-field { display: flex; align-items: center; gap: 10px; }
.search-field > span { flex: none; }
.search-field input { width: 100%; min-width: 0; border: 0; background: transparent; color: inherit; }
.search-field input:focus { outline: none; }
.search-field:focus-within { box-shadow: inset 0 0 0 2px #4ca8ec; }
.launch-top input::placeholder { color: #deeff7; }
.overlay-close { position: absolute; right: 0; top: 4px; color: #fff; }
.overlay-close:hover:not(:disabled) { background: #ffffff28; color: white; }
#launch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 14px; padding: 10px; }
.launch-item { display: grid; justify-items: center; align-content: start; gap: 11px; padding: 10px 5px; border: 0; border-radius: 9px; background: transparent; color: white; font-size: 13px; }
.launch-item:hover { background: #ffffff1d; }
.launch-item .app-icon { width: 63px; height: 63px; }
#spotlight { width: min(620px, calc(100% - 24px)); max-height: 77vh; margin: min(15vh, 100px) auto auto; overflow: auto; border-radius: 15px; box-shadow: 0 26px 75px #061e365c; }
#spotlight .search-field { padding: 17px 18px; border-bottom: 1px solid var(--line); font-size: 23px; color: var(--ink); }
#spotlight .search-field > span { color: var(--accent); }
.spotlight-caption { padding: 11px 16px 5px; color: var(--muted); font-size: 11px; font-weight: 650; }
#spotlight-results { padding: 0 7px 7px; }
.spotlight-item { display: flex; align-items: center; width: 100%; gap: 10px; padding: 6px 9px; border: 0; border-radius: 7px; text-align: left; background: none; }
.spotlight-item:hover, .spotlight-item.is-selected { background: var(--selected); }
.spotlight-item .app-icon, .spotlight-item .file-icon { width: 29px; height: 28px; }
.spotlight-item > span:last-child { display: grid; gap: 2px; font-size: 13px; }

  <script>
'use strict';

const widgetTypes = {
  clock: { name: 'Orologio', detail: 'Ora locale e data', color: 'blue', render: renderWidgetClock },
  calendar: { name: 'Calendario', detail: 'Sfoglia il mese e scegli un giorno', color: 'rose', render: renderWidgetCalendar },
  reminders: { name: 'Promemoria', detail: 'Aggiungi e spunta le tue attività', color: 'mint', render: renderWidgetReminders }
};
const widgetTimeFormat = new Intl.DateTimeFormat('it-IT', { hour: '2-digit', minute: '2-digit', hour12: false });
const widgetDateFormat = new Intl.DateTimeFormat('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
const widgetMonthFormat = new Intl.DateTimeFormat('it-IT', { month: 'long', year: 'numeric' });
let widgetEntries = [];
let widgetReminders = [];
let widgetCalendarDate = new Date();
let widgetTimeKey = '';

function readWidgetArray(key) {
  try {
    const data = JSON.parse(readValue(key, '[]'));
    return Array.isArray(data) ? data : [];
  } catch {
    return [];
  }
}

function widgetOnSpace(kind, space = activeSpace) {
  return widgetEntries.find((entry) => entry.kind === kind && entry.space === space);
}

function saveWidgets() {
  writeValue('widgets.v1', JSON.stringify(widgetEntries));
}

function relocateWidgets(from, to) {
  const moved = widgetEntries.filter((entry) => entry.space === from && !widgetOnSpace(entry.kind, to));
  widgetEntries = widgetEntries.filter((entry) => entry.space !== from);
  for (const entry of moved) widgetEntries.push({ ...entry, space: to });
  saveWidgets();
  renderWidgets();
}

function setWidget(kind, enabled) {
  const existing = widgetOnSpace(kind);
  if (enabled === Boolean(existing)) return;
  if (enabled) {
    const index = Object.keys(widgetTypes).indexOf(kind);
    const columns = Math.max(1, Math.min(3, Math.floor((desktop.clientWidth - 28) / 224)));
    const left = 16 + (index % columns) * 224;
    const top = 16 + Math.floor(index / columns) * 240;
    widgetEntries.push({ kind, space: activeSpace, left, top });
  } else {
    widgetEntries = widgetEntries.filter((entry) => entry !== existing);
  }
  saveWidgets();
  renderWidgets();
}

function openWidgetGallery() {
  closeMenu();
  byId('widget-gallery-space').textContent = spaceName(activeSpace);
  const options = byId('widget-options');
  options.replaceChildren();
  for (const [kind, widget] of Object.entries(widgetTypes)) {
    const option = button(widget.name, 'widget-option widget-' + widget.color,
      '<span class="widget-option-name"></span><span class="widget-option-detail"></span><span class="widget-option-state"></span>', () => {
        setWidget(kind, !widgetOnSpace(kind));
        update();
      });
    const update = () => {
      const enabled = Boolean(widgetOnSpace(kind));
      option.setAttribute('aria-pressed', enabled);
      option.querySelector('.widget-option-state').textContent = enabled ? 'Sulla scrivania' : 'Aggiungi';
    };
    option.querySelector('.widget-option-name').textContent = widget.name;
    option.querySelector('.widget-option-detail').textContent = widget.detail;
    update();
    options.append(option);
  }
  const gallery = byId('widget-gallery');
  gallery.showModal();
  options.querySelector('button')?.focus();
}

function updateWidgetPosition(card, entry, left = entry.left, top = entry.top) {
  const maxLeft = Math.max(6, desktop.clientWidth - (card.offsetWidth || 214) - 6);
  const maxTop = Math.max(6, desktop.clientHeight - (card.offsetHeight || 155) - 6);
  const position = { left: Math.round(Math.max(6, Math.min(left, maxLeft))), top: Math.round(Math.max(6, Math.min(top, maxTop))) };
  card.style.left = position.left + 'px';
  card.style.top = position.top + 'px';
  return position;
}

function positionWidgets() {
  for (const card of byId('widgets').querySelectorAll('[data-widget]')) {
    const entry = widgetOnSpace(card.dataset.widget);
    if (entry) updateWidgetPosition(card, entry);
  }
}

function bindWidgetMove(handle, card, entry) {
  let drag = null;
  handle.addEventListener('pointerdown', (event) => {
    if (event.button !== 0 || drag) return;
    drag = { ...updateWidgetPosition(card, entry), pointer: event.pointerId, startX: event.clientX, startY: event.clientY };
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener('pointermove', (event) => {
    if (drag?.pointer !== event.pointerId) return;
    Object.assign(entry, updateWidgetPosition(card, entry, drag.left + event.clientX - drag.startX, drag.top + event.clientY - drag.startY));
  });
  handle.addEventListener('lostpointercapture', (event) => {
    if (drag?.pointer !== event.pointerId) return;
    drag = null;
    saveWidgets();
  });
  handle.addEventListener('keydown', (event) => {
    const offsets = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    const offset = offsets[event.key];
    if (!offset) return;
    event.preventDefault();
    const start = updateWidgetPosition(card, entry);
    const step = event.shiftKey ? 32 : 8;
    Object.assign(entry, updateWidgetPosition(card, entry, start.left + offset[0] * step, start.top + offset[1] * step));
    saveWidgets();
  });
}

function renderWidgets() {
  const layer = byId('widgets');
  layer.replaceChildren();
  for (const entry of widgetEntries.filter((item) => item.space === activeSpace)) {
    const widget = widgetTypes[entry.kind];
    const card = document.createElement('section');
    card.className = 'desktop-widget widget-' + widget.color;
    card.dataset.widget = entry.kind;
    card.setAttribute('aria-label', widget.name);
    const header = document.createElement('header');
    const handle = button('Sposta ' + widget.name + ' con le frecce', 'widget-handle', '', () => {});
    handle.textContent = widget.name;
    handle.title = 'Trascina oppure usa le frecce';
    bindWidgetMove(handle, card, entry);
    const remove = iconButton('Rimuovi widget ' + widget.name, 'close', () => {
      setWidget(entry.kind, false);
      byId('system-menu').focus();
    });
    header.append(handle, remove);
    const content = document.createElement('div');
    content.className = 'widget-body';
    card.append(header, content);
    widget.render(content);
    layer.append(card);
  }
  positionWidgets();
  widgetTimeKey = '';
  updateWidgetTime(new Date());
}

function renderWidgetClock(content) {
  content.innerHTML = '<time class="widget-time"></time><p class="widget-date"></p>';
}

function updateWidgetTime(now) {
  const time = byId('widgets').querySelector('.widget-time');
  if (!time) return;
  const key = Math.floor(now.getTime() / 60000);
  if (widgetTimeKey === key) return;
  widgetTimeKey = key;
  time.dateTime = now.toISOString();
  time.textContent = widgetTimeFormat.format(now);
  byId('widgets').querySelector('.widget-date').textContent = widgetDateFormat.format(now);
}

function renderWidgetCalendar(content, focus = null) {
  const year = widgetCalendarDate.getFullYear();
  const month = widgetCalendarDate.getMonth();
  const today = new Date();
  const monthHead = document.createElement('div');
  monthHead.className = 'widget-calendar-head';
  const label = button('Torna a oggi', 'widget-calendar-label', '', () => {
    widgetCalendarDate = new Date();
    renderWidgetCalendar(content, '.widget-calendar-label');
  });
  label.textContent = widgetMonthFormat.format(widgetCalendarDate);
  const changeMonth = (offset, selector) => {
    widgetCalendarDate = new Date(year, month + offset, 1);
    renderWidgetCalendar(content, selector);
  };
  const previous = iconButton('Mese precedente', 'left', () => changeMonth(-1, '.widget-month-previous'));
  previous.classList.toggle('widget-month-previous', true);
  const next = iconButton('Mese successivo', 'right', () => changeMonth(1, '.widget-month-next'));
  next.classList.toggle('widget-month-next', true);
  monthHead.append(label, previous, next);
  const grid = document.createElement('div');
  grid.className = 'widget-calendar-grid';
  for (const weekday of ['L', 'M', 'M', 'G', 'V', 'S', 'D']) {
    const cell = document.createElement('span');
    cell.textContent = weekday;
    cell.setAttribute('aria-hidden', 'true');
    grid.append(cell);
  }
  const padding = (new Date(year, month, 1).getDay() + 6) % 7;
  for (let index = 0; index < padding; index += 1) grid.append(document.createElement('span'));
  const lastDay = new Date(year, month + 1, 0).getDate();
  for (let day = 1; day <= lastDay; day += 1) {
    const date = new Date(year, month, day);
    const dateButton = button(widgetDateFormat.format(date), '', String(day), () => {
      widgetCalendarDate = date;
      renderWidgetCalendar(content, '[data-day="' + day + '"]');
    });
    dateButton.dataset.day = String(day);
    dateButton.setAttribute('aria-pressed', day === widgetCalendarDate.getDate());
    if (date.toDateString() === today.toDateString()) dateButton.setAttribute('aria-current', 'date');
    grid.append(dateButton);
  }
  const selected = document.createElement('p');
  selected.className = 'widget-calendar-selected';
  selected.textContent = widgetDateFormat.format(widgetCalendarDate);
  content.replaceChildren(monthHead, grid, selected);
  positionWidgets();
  if (focus) content.querySelector(focus)?.focus();
}

function saveWidgetReminders() {
  const stored = writeValue('reminders.v1', JSON.stringify(widgetReminders));
  if (!stored) byId('announcement').textContent = 'Promemoria disponibili in questa sessione.';
}

function renderWidgetReminders(content, focusIndex = null) {
  const list = document.createElement('ul');
  list.className = 'widget-reminder-list';
  for (const [index, reminder] of widgetReminders.entries()) {
    const row = document.createElement('li');
    const toggle = button(reminder.text, 'widget-reminder-toggle', '', () => {
      reminder.done = !reminder.done;
      toggle.setAttribute('aria-pressed', reminder.done);
      saveWidgetReminders();
    });
    toggle.textContent = reminder.text;
    toggle.dataset.reminder = String(index);
    toggle.setAttribute('aria-pressed', reminder.done);
    row.append(toggle, iconButton('Rimuovi ' + reminder.text, 'close', () => {
      widgetReminders.splice(index, 1);
      saveWidgetReminders();
      renderWidgetReminders(content, Math.min(index, widgetReminders.length - 1));
    }));
    list.append(row);
  }
  const field = document.createElement('input');
  field.type = 'text';
  field.maxLength = 120;
  field.placeholder = 'Nuovo promemoria';
  field.setAttribute('aria-label', 'Nuovo promemoria');
  const addReminder = () => {
    const text = field.value.trim();
    if (!text || widgetReminders.length >= 40) return;
    widgetReminders.push({ text, done: false });
    saveWidgetReminders();
    renderWidgetReminders(content, -1);
    const updatedList = content.querySelector('.widget-reminder-list');
    updatedList.scrollTop = updatedList.scrollHeight;
  };
  const add = iconButton('Aggiungi promemoria', 'plus', addReminder);
  field.disabled = add.disabled = widgetReminders.length >= 40;
  if (field.disabled) field.placeholder = 'Limite di 40 promemoria';
  field.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.isComposing) addReminder();
  });
  const actions = document.createElement('div');
  actions.className = 'widget-reminder-add';
  actions.append(field, add);
  content.replaceChildren(list, actions);
  if (Number.isInteger(focusIndex) && focusIndex >= 0) content.querySelector('[data-reminder="' + focusIndex + '"]')?.focus();
  if (focusIndex === -1) {
    if (!field.disabled) field.focus();
    else list.querySelector('[data-reminder="39"]')?.focus();
  }
}

function setupWidgets() {
  widgetEntries = readWidgetArray('widgets.v1').filter((entry) =>
    entry && Object.hasOwn(widgetTypes, entry.kind) && spaces.includes(entry.space)
    && Number.isFinite(entry.left) && Number.isFinite(entry.top));
  widgetReminders = readWidgetArray('reminders.v1').filter((item) =>
    item && typeof item.text === 'string' && item.text.length <= 120 && typeof item.done === 'boolean').slice(0, 40);
  const gallery = byId('widget-gallery');
  byId('widgets-close').addEventListener('click', () => gallery.close());

    if (event.target.closest('.window, .desktop-widget')) return;
    event.preventDefault();
    toggleMenu(byId('system-menu'), false, [['Modifica widget…', openWidgetGallery]], { left: event.clientX, top: event.clientY });
  });
  renderWidgets();
}

function button(label, className, html, action) {

  element.className = className;
  element.setAttribute('aria-label', label);
  element.innerHTML = html;
  element.addEventListener('click', action);
  return element;
}

  element.title = label;

}

function readValue(key, fallback) {
  if (memory.has(key)) return memory.get(key);
  try {
    return localStorage.getItem('laguna.' + key) ?? fallback;
  } catch {
    return fallback;
  }
}

function writeValue(key, value) {
  memory.set(key, value);
  try {
    localStorage.setItem('laguna.' + key, value);
    return true;
  } catch {
    return false;
  }
}

const apps = {

};
const launchApps = ['finder', 'notes', 'calculator', 'settings'];
