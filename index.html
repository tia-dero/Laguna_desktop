const spaceLimit = 8;
const missionDragType = 'application/x-laguna-window';
let missionDrag = null;

function spaceName(id) {
  return 'Scrivania ' + (spaces.indexOf(id) + 1);
}

function addSpace() {
  if (spaces.length >= spaceLimit) return;
  const id = Math.max(...spaces) + 1;
  spaces.push(id);
  saveWallpaper('laguna', id);
  writeValue('wallpaper.image.' + id, '');
  saveWorkspace();
  renderMission('[data-add-space]');
}

function removeSpace(id) {
  if (spaces.length < 2 || !spaces.includes(id)) return;
  const index = spaces.indexOf(id);
  const destination = spaces[index === 0 ? 1 : index - 1];
  for (const record of windows.values()) {
    if (record.space === id) record.space = destination;
  }
  spaces = spaces.filter((space) => space !== id);
  relocateWidgets(id, destination);
  wallpaperSelection += 1;
  writeValue('wallpaper.image.' + id, '');
  if (activeSpace === id) switchSpace(destination);
  else syncSpaces();
  saveWorkspace();
  renderMission('[data-space="' + activeSpace + '"]');
}

function moveWindowToSpace(record, id) {
  if (!spaces.includes(id) || record.space === id) return;
  record.space = id;
  syncSpaces();
  if (activeWindow === record) {
    const next = [...windows.values()].filter((item) => !item.element.hidden)
      .sort((first, second) => second.order - first.order)[0];
    activate(next ?? null);
  } else saveWorkspace();
  byId('announcement').textContent = record.title.textContent + ' spostata in ' + spaceName(id);
  renderMission('[data-space="' + id + '"]');
}

function renderMission(focus = null) {
  const spacesBar = byId('mission-spaces');
  spacesBar.replaceChildren();
  for (const id of spaces) {
    const name = spaceName(id);
    const group = document.createElement('div');
    group.className = 'space-group';
    const tile = button(name, 'space-tile', '<span class="space-art" aria-hidden="true"></span><span class="space-name"></span>', () => {
      switchSpace(id);
      renderMission('[data-space="' + id + '"]');
    });
    tile.dataset.space = String(id);
    const sample = tile.querySelector('.space-art');
    const wallpaper = spaceWallpaper(id);
    sample.classList.toggle('wallpaper-sample', true);
    sample.dataset.art = wallpaper;
    if (wallpaper === 'personal') sample.style.backgroundImage = 'url("' + personalWallpaper(id) + '")';
    tile.querySelector('.space-name').textContent = name;
    tile.setAttribute('aria-pressed', id === activeSpace);
    tile.addEventListener('dragover', (event) => {
      if (!missionDrag || missionDrag.space === id || !event.dataTransfer.types.includes(missionDragType)) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
      tile.classList.toggle('is-drop-target', true);
    });
    tile.addEventListener('dragleave', (event) => {
      if (!event.relatedTarget || !tile.contains(event.relatedTarget)) tile.classList.toggle('is-drop-target', false);
    });
    tile.addEventListener('drop', (event) => {
      if (!missionDrag || !event.dataTransfer.types.includes(missionDragType)) return;
      event.preventDefault();
      const record = missionDrag;
      missionDrag = null;
      moveWindowToSpace(record, id);
    });
    group.append(tile);
    if (spaces.length > 1) {
      group.append(iconButton('Rimuovi ' + name, 'close', () => removeSpace(id)));
    }
    spacesBar.append(group);
  }
  const add = button('Nuova scrivania', 'space-add', icon('plus') + '<span>Nuova scrivania</span>', addSpace);
  add.dataset.addSpace = '';
  add.disabled = spaces.length >= spaceLimit;
  spacesBar.append(add);

  const grid = byId('mission-grid');
  grid.replaceChildren();
  const ordered = [...windows.values()].filter((record) => record.space === activeSpace)
    .sort((first, second) => second.order - first.order);
  for (const record of ordered) {
    const tile = button(record.title.textContent, 'mission-tile', '<span class="mission-preview"><span class="mission-titlebar"></span><span class="mission-content"></span></span>', () => {
      mission.close();
      openWindow(record.id);
    });
    tile.dataset.app = record.id;
    tile.querySelector('.mission-titlebar').textContent = record.title.textContent;
    tile.querySelector('.mission-content').innerHTML = appIcon(record.id);
    const label = document.createElement('span');
    label.textContent = record.title.textContent + (record.minimized ? ' · Minimizzata' : '');
    tile.append(label);
    tile.draggable = true;
    tile.addEventListener('dragstart', (event) => {
      missionDrag = record;
      event.dataTransfer.setData(missionDragType, record.id);
      event.dataTransfer.effectAllowed = 'move';
    });
    tile.addEventListener('dragend', () => {
      missionDrag = null;
      for (const target of spacesBar.querySelectorAll('.is-drop-target')) target.classList.toggle('is-drop-target', false);
    });
    const card = document.createElement('div');
    card.className = 'mission-card';
    card.append(tile);
    if (spaces.length > 1) {
      const destination = document.createElement('select');
      destination.setAttribute('aria-label', 'Sposta ' + record.title.textContent + ' in');
      const prompt = document.createElement('option');
      prompt.textContent = 'Sposta in…';
      prompt.value = '';
      destination.append(prompt);
      for (const id of spaces.filter((space) => space !== activeSpace)) {
        const option = document.createElement('option');
        option.value = id;
        option.textContent = spaceName(id);
        destination.append(option);
      }
      destination.addEventListener('change', () => moveWindowToSpace(record, Number(destination.value)));
      card.append(destination);
    }
    grid.append(card);
  }
  if (!ordered.length) grid.append(noResults('Nessuna finestra aperta'));
  if (focus) spacesBar.querySelector(focus)?.focus();
}

function openMission() {
  closeMenu();
  if (spotlight.open) spotlight.close();
  if (launchpad.open) launchpad.close();
  renderMission();
  mission.showModal();
  byId('mission-spaces').querySelector('[data-space="' + activeSpace + '"]').focus();
}

const menuPopover = byId('menu-popover');
let menuAnchor = null;

function closeMenu(restoreFocus = false) {
  if (!menuAnchor) return;
  const anchor = menuAnchor;
  menuAnchor = null;
  anchor.setAttribute('aria-expanded', 'false');
  menuPopover.hidden = true;
  if (restoreFocus) anchor.focus();
}

function toggleFullScreen() {
  const request = document.fullscreenElement
    ? document.exitFullscreen()
    : document.documentElement.requestFullscreen?.();
  request?.catch(() => {
    byId('announcement').textContent = 'Per lo schermo intero del browser, premi F11.';
  });
}

function menuItems(name) {
  const current = activeWindow;
  const record = windows.get('finder');
  const items = {
    Sistema: [['Informazioni su Laguna', () => openWindow('info')], ['Impostazioni…', () => openWindow('settings')], ['Modifica widget…', openWidgetGallery], ['Launchpad', openLaunchpad]],
    App: [['Apri Finder', () => openWindow('finder')], ['Apri Launchpad', openLaunchpad], ['Chiudi finestra attiva', () => closeWindow(current), !current]],
    File: [
      ...(current?.id === 'finder' ? finderActions() : []),
      ['Apri un file da Windows…', () => byId('file-picker').click()]
    ],
    Vista: [
      ['Finder a icone', () => { openWindow('finder'); setFinderView('grid'); }],
      ['Finder a elenco', () => { openWindow('finder'); setFinderView('list'); }],
      ['Ordina per nome', () => sortFinder('name')],
      ['Ordina per tipo', () => sortFinder('kind')],
      ['Ordine originale', () => sortFinder('default')],
      [document.fullscreenElement ? 'Esci da schermo intero' : 'Schermo intero', toggleFullScreen]
    ],
    Finestra: [
      ['Mission Control', openMission],
      ['Nuova scheda Finder', () => { openWindow('finder'); newFinderTab(); }, finder.tabs.length >= tabLimit],
      ['Riduci a icona', () => minimize(current), !current],
      [current?.maximized ? 'Ripristina dimensioni' : 'Ingrandisci', () => toggleMaximize(current), !current],
      ...[...windows.values()].map((item) => [
        item === record ? 'Finder · ' + folderInfo(currentFolder()).name : item.title.textContent,
        () => openWindow(item.id)
      ])
    ],
    Aiuto: [['Guida e scorciatoie', () => openWindow('info')], ['Cerca con Spotlight', toggleSpotlight]]
  };
  return items[name];
}

function toggleMenu(anchor, keyboard = false, options = menuItems(anchor.dataset.menu), point = null) {
  const previous = menuAnchor;
  closeMenu();
  if (previous === anchor && !point) return;
  menuAnchor = anchor;
  anchor.setAttribute('aria-expanded', 'true');
  menuPopover.replaceChildren();
  for (const [label, action, disabled] of options) {
    const item = button(label, '', '', () => {
      closeMenu(true);
      action();
    });
    item.textContent = label;
    item.disabled = Boolean(disabled);
    menuPopover.append(item);
  }
  menuPopover.hidden = false;
  const rect = anchor.getBoundingClientRect();
  menuPopover.style.left = Math.max(6, Math.min(point?.left ?? rect.left, innerWidth - menuPopover.offsetWidth - 6)) + 'px';
  menuPopover.style.top = Math.max(6, Math.min(point?.top ?? (anchor.dataset.menu ? 38 : rect.bottom + 5), innerHeight - menuPopover.offsetHeight - 6)) + 'px';
  if (keyboard) menuPopover.querySelector('button:not(:disabled)')?.focus();
}

function buildDesktop() {
  byId('system-menu').innerHTML = icon('system');
  byId('search-button').innerHTML = icon('search');
  byId('settings-button').innerHTML = icon('sliders');
  for (const element of document.querySelectorAll('[data-icon]')) element.innerHTML = icon(element.dataset.icon);
  const icons = byId('desktop-icons');
  for (const [label, art, action] of [
    ['Disco virtuale', 'drive', () => showFolder('desktop')],
    ['Documenti', 'folder', () => showFolder('documents')]
  ]) {
    icons.append(button(label, 'desktop-item', fileIcon(art) + '<span>' + label + '</span>', action));
  }
  for (const anchor of document.querySelectorAll('[data-menu]')) {
    anchor.setAttribute('aria-expanded', 'false');
    anchor.setAttribute('aria-controls', 'menu-popover');
    anchor.addEventListener('click', (event) => toggleMenu(anchor, event.detail === 0));
    anchor.addEventListener('keydown', (event) => {
      if (event.key !== 'ArrowDown') return;
      event.preventDefault();
      if (anchor === menuAnchor) menuPopover.querySelector('button:not(:disabled)')?.focus();
      else toggleMenu(anchor, true);
    });
  }
}

function renderDock(visible) {
  const dock = byId('dock');
  dock.replaceChildren();
  for (const id of visible) {
    if (id === 'trash') {
      const divider = document.createElement('span');
      divider.className = 'dock-divider';
      divider.setAttribute('aria-hidden', 'true');
      dock.append(divider);
    }
    const name = appName(id);
    const entry = button(name, 'dock-item', appIcon(id) + '<span class="dock-tooltip" aria-hidden="true">' + name + '</span>', () => launch(id));
    entry.dataset.app = id;
    if (id === 'trash') bindFinderDrop(entry, 'trash');
    if (configurableDockApps.includes(id)) bindDockItem(entry, id);
    dock.append(entry);
  }
}

function bindDockItem(entry, id) {
  const pinned = () => !dockPrefs.unpinned.includes(id);
  const showOptions = (keyboard, point) => {
    const choices = [
      [pinned() ? 'Rimuovi dal Dock' : 'Mantieni nel Dock', () => pinDockApp(id)],
      ['Impostazioni Dock…', () => {
        const settings = openWindow('settings');
        settings.content.querySelector('[data-dock-autohide]')?.focus();
      }]
    ];
    toggleMenu(entry, keyboard, choices, point);
  };
  entry.dataset.dockMenu = '';
  entry.setAttribute('aria-controls', 'menu-popover');
  entry.setAttribute('aria-expanded', 'false');
  entry.addEventListener('contextmenu', (event) => {
    event.preventDefault();
    showOptions(false, { left: event.clientX, top: event.clientY - 80 });
  });
  entry.addEventListener('keydown', (event) => {
    if (event.key !== 'ContextMenu' && !(event.shiftKey && event.key === 'F10')) return;
    event.preventDefault();
    const rect = entry.getBoundingClientRect();
    showOptions(true, { left: rect.left, top: rect.top - 80 });
  });
  entry.draggable = true;
  entry.addEventListener('dragstart', (event) => {
    if (!pinned()) {
      event.preventDefault();
      return;
    }
    dockDrag = id;
    event.dataTransfer.setData(dockDragType, id);
    event.dataTransfer.effectAllowed = 'move';
  });
  entry.addEventListener('dragover', (event) => {
    if (!pinned() || !dockDrag || dockDrag === id || !event.dataTransfer.types.includes(dockDragType)) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    const rect = entry.getBoundingClientRect();
    entry.dataset.dockDrop = event.clientX < (rect.left + rect.right) / 2 ? 'before' : 'after';
  });
  entry.addEventListener('dragleave', (event) => {
    if (!event.relatedTarget || !entry.contains(event.relatedTarget)) delete entry.dataset.dockDrop;
  });
  entry.addEventListener('drop', (event) => {
    if (!pinned() || !dockDrag || !event.dataTransfer.types.includes(dockDragType)) return;
    event.preventDefault();
    const rect = entry.getBoundingClientRect();
    const moved = dockDrag;
    dockDrag = null;
    delete entry.dataset.dockDrop;
    moveDockApp(moved, id, event.clientX >= (rect.left + rect.right) / 2);
  });
  entry.addEventListener('dragend', () => {
    dockDrag = null;
    for (const target of byId('dock').querySelectorAll('[data-dock-drop]')) delete target.dataset.dockDrop;
  });
}

function renderDockSettings() {
  const group = document.createElement('fieldset');
  const title = document.createElement('legend');
  title.textContent = 'Dock';
  const hide = button('Nascondi automaticamente il Dock', 'choice', 'Nascondi automaticamente il Dock', () => {
    updateDockPrefs({ ...dockPrefs, autoHide: !dockPrefs.autoHide }, null, '[data-dock-autohide]');
  });
  hide.dataset.dockAutohide = '';
  hide.setAttribute('aria-pressed', dockPrefs.autoHide);
  group.append(title, hide);
  const list = document.createElement('div');
  list.className = 'dock-settings-list';
  for (const [index, id] of dockPrefs.order.entries()) {
    const row = document.createElement('div');
    row.className = 'dock-settings-row';
    const name = appName(id);
    const pinned = !dockPrefs.unpinned.includes(id);
    const label = (pinned ? 'Rimuovi ' : 'Fissa ') + name;
    const pin = button(label, 'choice', '', () => pinDockApp(id, true));
    pin.textContent = name;
    pin.dataset.dockPin = id;
    pin.setAttribute('aria-label', name + ' nel Dock');
    pin.title = label;
    pin.setAttribute('aria-pressed', pinned);
    const left = iconButton('Sposta ' + name + ' a sinistra', 'left', () => moveDockApp(id, dockPrefs.order[index - 1], false, true));
    const right = iconButton('Sposta ' + name + ' a destra', 'right', () => moveDockApp(id, dockPrefs.order[index + 1], true, true));
    left.disabled = index === 0;
    right.disabled = index === dockPrefs.order.length - 1;
    row.append(pin, left, right);
    list.append(row);
  }
  group.append(list);
  return group;
}

function setupEvents() {
  const reveal = byId('dock-reveal');
  reveal.addEventListener('click', () => {
    dockRevealed = !dockRevealed;
    setDockVisibility();
    if (dockRevealed) byId('dock').querySelector('button')?.focus();
  });
  reveal.addEventListener('dragover', (event) => {
    if (!finderDrag.length) return;
    event.preventDefault();
    byId('dock-area').classList.toggle('finder-reveal', true);
  });
  document.addEventListener('dragend', () => byId('dock-area').classList.toggle('finder-reveal', false));
  document.addEventListener('drop', () => byId('dock-area').classList.toggle('finder-reveal', false), true);
  byId('search-button').addEventListener('click', toggleSpotlight);
  const controlButton = byId('settings-button');
  controlButton.setAttribute('aria-expanded', 'false');
  controlButton.setAttribute('aria-controls', 'control-center');
  controlButton.addEventListener('click', toggleControlCenter);
  byId('control-close').addEventListener('click', () => controlCenter.close());
  controlCenter.addEventListener('close', () => controlButton.setAttribute('aria-expanded', 'false'));
  byId('quicklook-close').addEventListener('click', () => quickLook.close());
  byId('quicklook-open').addEventListener('click', () => {
    const item = quickLookItem;
    quickLook.close();
    openItem(item);
  });
  quickLook.addEventListener('close', () => {
    if (!quickLook.open) releaseQuickLook();
  });
  quickLook.addEventListener('keydown', (event) => {
    if (event.code !== 'Space' || event.ctrlKey || event.metaKey || event.isComposing || event.target === byId('quicklook-open')) return;
    event.preventDefault();
    quickLook.close();
  });
  byId('file-picker').addEventListener('change', openLocalFile);
  byId('import-picker').addEventListener('change', importVirtualFile);
  byId('wallpaper-picker').addEventListener('change', importWallpaper);
  byId('finder-dialog-cancel').addEventListener('click', () => byId('finder-dialog').close());
  byId('mission-close').addEventListener('click', () => mission.close());
  byId('finder-form').addEventListener('submit', (event) => {
    event.preventDefault();
    const error = finderSubmit?.();
    if (error) byId('finder-dialog-error').textContent = error;
    else byId('finder-dialog').close();
  });
  launchSearch.addEventListener('input', renderLaunchpad);
  launchSearch.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.isComposing) byId('launch-grid').querySelector('button')?.click();
  });
  spotlightSearch.setAttribute('role', 'combobox');
  spotlightSearch.setAttribute('aria-controls', 'spotlight-results');
  spotlightSearch.setAttribute('aria-autocomplete', 'list');
  spotlightSearch.setAttribute('aria-expanded', 'true');
  byId('spotlight-results').setAttribute('role', 'listbox');
  spotlightSearch.addEventListener('input', renderSpotlight);
  spotlightSearch.addEventListener('keydown', (event) => {
    if (event.isComposing) return;
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault();
      chooseResult(selectedResult + (event.key === 'ArrowDown' ? 1 : -1), true);
    }
    if (event.key === 'Enter') runResult(selectedResult);
  });
  for (const dialog of [launchpad, spotlight, mission, quickLook, controlCenter]) {
    dialog.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape' || event.isComposing) return;
      event.preventDefault();
      dialog.close();
    });
    dialog.addEventListener('click', (event) => {
      if (event.target !== dialog) return;
      const rect = dialog.getBoundingClientRect();
      if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
    });
  }
  launchpad.querySelector('[data-close-overlay]').addEventListener('click', () => launchpad.close());
  document.addEventListener('pointerdown', (event) => {
    if (!event.target.closest('#menu-popover, [data-menu], [data-finder-menu], [data-dock-menu]')) closeMenu();
    if (dockRevealed && !event.target.closest('#dock-area, #menu-popover')) {
      dockRevealed = false;
      setDockVisibility();
    }
  });
  document.addEventListener('keydown', (event) => {
    if (event.isComposing) return;
    if (event.code === 'Space' && event.ctrlKey && !event.altKey && !event.metaKey && !event.shiftKey) {
      event.preventDefault();
      if (!event.repeat) toggleSpotlight();
    }
    if (event.key === 'Escape' && menuAnchor) closeMenu(true);
    else if (event.key === 'Escape' && dockPrefs.autoHide && event.target.closest('#dock')) {
      dockRevealed = false;
      setDockVisibility();
      reveal.focus();
    }
  });
  menuPopover.addEventListener('keydown', (event) => {
    if (!['ArrowUp', 'ArrowDown'].includes(event.key)) return;
    event.preventDefault();
    const buttons = [...menuPopover.querySelectorAll('button:not(:disabled)')];
    const index = buttons.indexOf(document.activeElement);
    const direction = event.key === 'ArrowUp' ? -1 : 1;
    buttons[(index + direction + buttons.length) % buttons.length]?.focus();
  });
  window.addEventListener('resize', () => {
    closeMenu();
    for (const record of windows.values()) position(record);
    positionWidgets();
  });
  window.addEventListener('pagehide', (event) => {
    if (!event.persisted) {
      clearPreview();
      releaseQuickLook();
    }
  });
}

const clockFormat = new Intl.DateTimeFormat('it-IT', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
function updateClock() {
  const now = new Date();
  const clock = byId('clock');
  clock.dateTime = now.toISOString();
  clock.textContent = clockFormat.format(now);
  updateWidgetTime(now);
}

let restoringWorkspace = true;
const restorableApps = ['finder', 'notes', 'calculator', 'settings'];

function saveWorkspace() {
  if (restoringWorkspace) return;
  const state = [...windows.values()].filter(({ id }) => restorableApps.includes(id))
    .sort((first, second) => first.order - second.order)
    .map(({ id, rect, minimized, maximized, space }) => ({ id, rect, minimized, maximized, space }));
  writeValue('workspace.v1', JSON.stringify({
    windows: state, spaces, activeSpace, folder: currentFolder(), view: finder.view, sort: finder.sort,
    tabs: finder.tabs.map((tab) => tab.history[tab.index]), activeTab: finder.activeTab
  }));
}

function restoreWorkspace() {
  const saved = readValue('workspace.v1', '');
  if (!saved) {
    openWindow('finder', false);
    return;
  }
  try {
    const state = JSON.parse(saved);
    if (!Array.isArray(state.windows)) throw new Error('Scrivania non valida');
    const savedTabs = Array.isArray(state.tabs) && state.tabs.length ? state.tabs.slice(0, tabLimit) : [state.folder];
    finder.tabs = savedTabs.map((id) => ({ history: [fixedFolders.includes(id) || canWriteFolder(id) ? id : 'documents'], index: 0 }));
    if (Number.isInteger(state.activeTab) && state.activeTab >= 0 && state.activeTab < finder.tabs.length) finder.activeTab = state.activeTab;
    if (state.view === 'list') finder.view = 'list';
    if (['name', 'kind'].includes(state.sort)) finder.sort = state.sort;
    if (Array.isArray(state.spaces) && state.spaces.length) {
      const savedSpaces = [...new Set(state.spaces)].filter((id) => Number.isSafeInteger(id) && id > 0);
      if (savedSpaces.length) spaces = savedSpaces.slice(0, spaceLimit);
    }
    activeSpace = spaces.includes(state.activeSpace) ? state.activeSpace : spaces[0];
    for (const item of state.windows) {
      if (!restorableApps.includes(item?.id) || windows.has(item.id)) continue;
      const record = openWindow(item.id, false);
      record.space = spaces.includes(item.space) ? item.space : spaces[0];
      if (['left', 'top', 'width', 'height'].every((key) => Number.isFinite(item.rect?.[key]))) record.rect = item.rect;
      if (item.maximized) toggleMaximize(record);
      else position(record);
      if (item.minimized) {
        record.minimized = true;
      }
    }
    syncSpaces();
    const visible = [...windows.values()].filter((item) => !item.element.hidden);
    activate(visible.at(-1) ?? null);
  } catch {
    openWindow('finder', false);
  }
}

buildDesktop();
setupEvents();
for (const [key, preference] of Object.entries(preferences)) {
  if (key === 'wallpaper') continue;
  const fallback = Object.keys(preference.choices)[0];
  const stored = readValue(key, fallback);
  applyPreference(key, Object.hasOwn(preference.choices, stored) ? stored : fallback);
}
updateClock();
setInterval(updateClock, 1000);
restoreWorkspace();
restoringWorkspace = false;
syncWallpaper();
refreshDock();
setupWidgets();
</script>
</body>
</html>
